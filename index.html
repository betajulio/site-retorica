<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retórica | QG Classic Rock</title>
    
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fira+Sans+Extra+Condensed:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f4f1ea; 
            --grunge-texture: url('https://www.transparenttextures.com/patterns/aged-paper.png');
            --primary-red: #8B0000; 
            --text-dark: #222;
            --nav-bg: #111;
            --font-headings: 'Anton', sans-serif;
            --font-body: 'Fira Sans Extra Condensed', sans-serif;
        }

        body { 
            background-color: var(--bg-color); 
            background-image: var(--grunge-texture);
            color: var(--text-dark); 
            font-family: var(--font-body); 
            margin: 0; 
            scroll-behavior: smooth; 
        }

        header { 
            text-align: center; 
            padding: 70px 20px; 
            border-bottom: 4px solid var(--primary-red);
            background: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        header h1 { font-size: 5.5em; margin: 0; color: #000; text-shadow: 3px 3px 0px var(--primary-red); font-family: var(--font-headings); }
        header p { font-size: 1.6em; color: var(--text-dark); margin-top: -5px; font-weight: 700; text-transform: uppercase; }

        .quick-access { display: flex; justify-content: center; gap: 15px; margin-top: -30px; position: relative; z-index: 10; flex-wrap: wrap; }
        .btn-main { background: var(--primary-red); color: #fff; padding: 12px 30px; text-decoration: none; font-size: 1.1em; border: none; border-radius: 3px; box-shadow: 0 5px 15px rgba(139,0,0,0.3); transition: 0.3s; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-main:hover { background: #a50000; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(165,0,0,0.5); }

        nav { background: var(--nav-bg); padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; border-bottom: 2px dashed var(--primary-red); }
        nav a { color: #aaa; text-decoration: none; margin: 0 15px; font-family: var(--font-headings); font-size: 1.5em; transition: 0.3s; }
        nav a:hover { color: var(--primary-red); }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        
        section { background-color: rgba(255,255,255,0.7); padding: 40px; margin-bottom: 40px; border: 1px solid #ddd; border-left: 10px solid var(--primary-red); position: relative; }
        section h2 { font-size: 3.5em; border-bottom: 2px solid var(--primary-red); padding-bottom: 10px; margin-top: 0; font-family: var(--font-headings); }

        /* GRID DE MEMBROS ESTILIZADA */
        .members-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; 
            margin-top: 30px; 
        }

        .member-card { 
            background: #fff; 
            border: 1px solid #ccc; 
            padding: 0; 
            text-align: center; 
            transition: 0.4s; 
            overflow: hidden;
            box-shadow: 5px 5px 0px var(--primary-red);
        }

        .member-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 10px 10px 0px var(--primary-red);
        }

        .member-photo-container {
            width: 100%;
            height: 250px;
            background: #eee;
            overflow: hidden;
            border-bottom: 4px solid var(--primary-red);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .member-card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: sepia(30%) contrast(1.1); /* Toque clássico nas fotos */
            transition: 0.5s;
        }

        .member-card:hover img { filter: sepia(0%) contrast(1.1); transform: scale(1.05); }

        .member-info { padding: 20px; }
        .member-card h3 { margin: 0; font-size: 2.2em; color: #111; line-height: 1; }
        .member-card p { 
            color: var(--primary-red); 
            margin-top: 8px; 
            font-size: 1.2em; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #setlist-content { font-size: 1.3em; line-height: 1.8; padding: 20px; background: #fff; border: 1px dashed #bbb; }

        footer { text-align: center; padding: 60px; border-top: 1px solid #ddd; margin-top: 50px; font-size: 2.5em; opacity: 0.6; }
    </style>
</head>
<body>

<header>
    <h1>RETÓRICA</h1>
    <p>A Toca do Mineiro | Itaquaquecetuba</p>
</header>

<div class="quick-access">
    <a href="#ensaio" class="btn-main">🎸 Ensaio</a>
    <a href="#membros" class="btn-main">🤘 A Banda</a>
    <button onclick="netlifyIdentity.open()" class="btn-main" style="background:#333">🔐 Gestão</button>
</div>

<nav>
    <a href="#membros">MEMBROS</a>
    <a href="#ensaio">SETLIST</a>
</nav>

<div class="container">

    <section id="membros">
        <h2>Line-up</h2>
        <div class="members-grid">
            
            <div class="member-card">
                <div class="member-photo-container">
                    <img src="./imagens/membros/julio.jpg" alt="Julio" onerror="this.src='https://ui-avatars.com/api/?name=Julio&background=fff&color=8B0000'">
                </div>
                <div class="member-info">
                    <h3>JULIO</h3>
                    <p>Guitarra e Voz</p>
                </div>
            </div>

            <div class="member-card">
                <div class="member-photo-container">
                    <img src="./imagens/membros/vini.jpg" alt="Vini" onerror="this.src='https://ui-avatars.com/api/?name=Vini&background=fff&color=8B0000'">
                </div>
                <div class="member-info">
                    <h3>VINI</h3>
                    <p>Guitarra e Baixo</p>
                </div>
            </div>

            <div class="member-card">
                <div class="member-photo-container">
                    <img src="./imagens/membros/nei.jpg" alt="Nei" onerror="this.src='https://ui-avatars.com/api/?name=Nei&background=fff&color=8B0000'">
                </div>
                <div class="member-info">
                    <h3>NEI</h3>
                    <p>Baixo</p>
                </div>
            </div>

            <div class="member-card">
                <div class="member-photo-container">
                    <img src="./imagens/membros/renato.jpg" alt="Renato" onerror="this.src='https://ui-avatars.com/api/?name=Renato&background=fff&color=8B0000'">
                </div>
                <div class="member-info">
                    <h3>RENATO</h3>
                    <p>Teclado e Violão</p>
                </div>
            </div>

            <div class="member-card">
                <div class="member-photo-container">
                    <img src="./imagens/membros/matheus.jpg" alt="Matheus" onerror="this.src='https://ui-avatars.com/api/?name=Matheus&background=fff&color=8B0000'">
                </div>
                <div class="member-info">
                    <h3>MATHEUS</h3>
                    <p>Violão e Voz</p>
                </div>
            </div>

            <div class="member-card">
                <div class="member-photo-container">
                    <img src="./imagens/membros/roni.jpg" alt="Roni" onerror="this.src='https://ui-avatars.com/api/?name=Roni&background=fff&color=8B0000'">
                </div>
                <div class="member-info">
                    <h3>RONI</h3>
                    <p>Bateria e Voz</p>
                </div>
            </div>

        </div>
    </section>

    <section id="ensaio">
        <h2>Próximo Ensaio</h2>
        <div id="setlist-content">
            <p>Carregando setlist da semana...</p>
        </div>
    </section>

</div>

<footer>
    🐀 🤘 🕷️
</footer>

<script>
    // Carregamento do Setlist via CMS
    fetch('/conteudo/ensaio_atual.md')
        .then(response => response.text())
        .then(text => {
            let content = text.split('---').pop();
            document.getElementById('setlist-content').innerHTML = marked.parse(content);
        })
        .catch(err => {
            document.getElementById('setlist-content').innerHTML = "<p>Nenhum ensaio programado no momento.</p>";
        });

    // Netlify Identity
    if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
            if (!user) {
                window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
            }
        });
    }
</script>

</body>
</html>
