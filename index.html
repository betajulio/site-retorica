<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0804">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="imagens/Toca_do_Mineiro_logo_final.png">
<title>Retórica — Classic Rock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;700;900&family=IM+Fell+English+SC&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{--black:#0a0804;--dark:#130f09;--brown:#2a1a08;--amber:#c8820a;--gold:#e8a820;--cream:#f0e4c8;--rust:#8b3a0a;--paper:#d4c4a0;--smoke:#6b6050}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--black);color:var(--cream);font-family:'Lora',serif;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.4}

  /* NAV */
  nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:linear-gradient(180deg,rgba(10,8,4,.98),rgba(10,8,4,.85));border-bottom:1px solid rgba(200,130,10,.3);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:60px;backdrop-filter:blur(10px)}
  .nav-logo{font-family:'Cinzel',serif;font-size:1.4rem;font-weight:900;color:var(--gold);letter-spacing:.15em}
  .nav-links{display:flex;list-style:none}
  .nav-links a{color:var(--paper);text-decoration:none;font-family:'Lora',serif;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:.5rem .7rem;transition:color .2s;cursor:pointer}
  .badge-new{position:absolute;top:50%;left:calc(100% + 2px);transform:translateY(-50%);background:var(--gold);color:var(--black);font-family:'Bebas Neue',sans-serif;font-size:.55rem;letter-spacing:.1em;padding:.08rem .35rem;border-radius:1px;animation:pulse-badge 2s infinite;white-space:nowrap;pointer-events:none}
  @keyframes pulse-badge {0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.1)}}
  .badge-new-mobile{display:none}
  @media(max-width:768px){
    .badge-new{display:none!important}
    .badge-new-mobile{display:inline-block!important;position:static;transform:none;animation:pulse-badge 2s infinite}
  }

  /* NEWS POPUP */
  .news-popup{position:fixed;top:72px;left:1.2rem;transform:translateX(-120%);background:linear-gradient(135deg,var(--brown),rgba(19,15,9,.97));border:1px solid var(--amber);color:var(--cream);padding:.45rem .65rem .45rem .8rem;border-radius:2px;z-index:10000;box-shadow:0 4px 24px rgba(0,0,0,.5);transition:transform .4s cubic-bezier(.34,1.56,.64,1);text-decoration:none;display:none;align-items:center;gap:.5rem;white-space:nowrap}
  .news-popup.show{display:flex;transform:translateX(0)}
  .news-popup.dismissed{display:none!important}
  .news-popup-close{background:none;border:none;color:var(--smoke);font-size:1.1rem;cursor:pointer;line-height:1;padding:.1rem .3rem;transition:color .15s;flex-shrink:0}
  .news-popup-close:hover{color:var(--cream)}
  .news-popup-new{background:var(--gold);color:var(--black);font-family:'Bebas Neue',sans-serif;font-size:.55rem;letter-spacing:.1em;padding:.06rem .3rem;border-radius:1px;animation:pulse-badge 2s infinite;flex-shrink:0}
  .news-popup-text{color:var(--cream);font-family:'Cinzel',serif;font-size:.75rem;font-weight:700;letter-spacing:.04em}
  @media(max-width:768px){
    .news-popup{top:68px;left:50%;transform:translateX(-50%) translateY(-120%);font-size:.85rem}
    .news-popup.show{transform:translateX(-50%) translateY(0)}
  }
  .nav-links a:hover{color:var(--gold)}
  .nav-auth{display:flex;align-items:center;gap:.8rem}
  .nav-user{font-size:.75rem;color:var(--amber);font-family:'Cinzel',serif;letter-spacing:.08em}

  /* HERO */
  #hero{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 60%,rgba(200,130,10,.08) 0%,transparent 70%),radial-gradient(ellipse 40% 40% at 20% 80%,rgba(139,58,10,.12) 0%,transparent 60%)}
  .hero-lines{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(200,130,10,.04) 59px,rgba(200,130,10,.04) 60px)}
  .hero-content{position:relative;text-align:center;animation:fadeUp 1.2s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
  .hero-tag{font-family:'IM Fell English SC',serif;font-size:.85rem;letter-spacing:.4em;color:var(--amber);text-transform:uppercase;margin-bottom:1.5rem}
  .hero-title{font-family:'Cinzel',serif;font-size:clamp(5rem,14vw,12rem);font-weight:900;color:var(--cream);line-height:.85;text-shadow:0 0 80px rgba(200,130,10,.3),3px 3px 0 rgba(139,58,10,.4);animation:fadeUp 1.2s .2s ease both}

  @media(max-width:768px){
    .hero-title{font-size:clamp(2.8rem,18vw,5rem)}
  }
  .hero-subtitle{font-family:'IM Fell English SC',serif;font-size:1rem;letter-spacing:.5em;color:var(--smoke);margin-top:1.5rem;animation:fadeUp 1.2s .4s ease both}
  .hero-divider{display:flex;align-items:center;gap:1rem;margin:2rem auto;width:300px;animation:fadeUp 1.2s .6s ease both}
  .hero-divider::before{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--amber))}
  .hero-divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--amber),transparent)}
  .hero-diamond{width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
  .scroll-hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5rem;color:var(--smoke);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;animation:bounce 2s infinite}
  .scroll-arrow{width:1px;height:30px;background:linear-gradient(180deg,transparent,var(--amber))}
  @keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}

  /* SECTIONS */
  section{padding:6rem 2rem;max-width:1100px;margin:0 auto}
  .section-header{display:flex;align-items:center;gap:1.5rem;margin-bottom:3.5rem}
  .section-number{font-family:'Bebas Neue',sans-serif;font-size:4rem;color:rgba(200,130,10,.2);line-height:1;min-width:60px}
  .section-title-wrap h2{font-family:'Cinzel',serif;font-size:2rem;font-weight:700;color:var(--cream);letter-spacing:.05em}
  .section-title-wrap p{color:var(--smoke);font-size:.85rem;letter-spacing:.1em;margin-top:.3rem;text-transform:uppercase}
  .section-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(200,130,10,.4),transparent)}
  .full-divider{border:none;height:1px;background:linear-gradient(90deg,transparent,rgba(200,130,10,.2),transparent);max-width:1100px;margin:0 auto}

  /* MEMBERS */
  .members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.5rem}
  .member-card{background:linear-gradient(135deg,rgba(42,26,8,.8),rgba(19,15,9,.9));border:1px solid rgba(200,130,10,.2);border-radius:2px;padding:1.5rem 1.2rem;text-align:center;transition:border-color .3s,transform .3s;position:relative;overflow:hidden}
  .member-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent);opacity:0;transition:opacity .3s}
  .member-card:hover{border-color:rgba(200,130,10,.5);transform:translateY(-3px)}
  .member-card:hover::before{opacity:1}
  .member-card.editable{cursor:pointer}
  .member-edit-hint{position:absolute;bottom:0;left:0;right:0;background:rgba(200,130,10,.12);color:var(--amber);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;padding:.35rem;opacity:0;transition:opacity .2s;font-family:'Cinzel',serif}
  .member-card.editable:hover .member-edit-hint{opacity:1}
  .member-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--brown),var(--rust));margin:0 auto 1rem;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:1.6rem;color:var(--gold);border:2px solid rgba(200,130,10,.3);overflow:hidden}
  .member-avatar img{width:100%;height:100%;object-fit:cover}
  .member-name{font-family:'Cinzel',serif;font-size:.95rem;font-weight:700;color:var(--cream);margin-bottom:.5rem}
  .member-instruments{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;margin-bottom:.4rem}
  .instrument-tag{background:rgba(200,130,10,.12);border:1px solid rgba(200,130,10,.3);color:var(--amber);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;border-radius:1px}
  .member-since{font-size:.7rem;color:var(--smoke);margin-top:.3rem;font-style:italic}
  .remove-btn{position:absolute;top:.5rem;right:.5rem;background:none;border:none;color:rgba(139,58,10,.5);cursor:pointer;font-size:1rem;transition:color .2s;line-height:1;z-index:2}
  .remove-btn:hover{color:var(--rust)}
  .inst-cb{display:none}
  .inst-label{background:rgba(10,8,4,.6);border:1px solid rgba(200,130,10,.2);color:var(--smoke);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:.35rem .7rem;border-radius:1px;cursor:pointer;transition:all .2s;user-select:none}
  .inst-cb:checked+.inst-label{background:rgba(200,130,10,.15);border-color:var(--amber);color:var(--amber)}
  .instruments-check{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.3rem}
  .img-upload-area{border:1px dashed rgba(200,130,10,.3);border-radius:2px;padding:1rem;text-align:center;cursor:pointer;transition:border-color .2s;position:relative}
  .img-upload-area:hover{border-color:var(--amber)}
  .img-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .img-preview{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid rgba(200,130,10,.3);margin:0 auto .5rem;display:none}
  .img-upload-hint{font-size:.75rem;color:var(--smoke);font-style:italic}

  /* PROMO SYSTEM STYLES */
  .countdown-badge{background:rgba(200,130,10,.15);border:1px solid rgba(200,130,10,.4);color:var(--gold);font-size:.7rem;letter-spacing:.08em;padding:.3rem .6rem;border-radius:1px;font-family:'Bebas Neue',sans-serif;display:inline-flex;align-items:center;gap:.4rem;margin-top:.5rem}
  .countdown-badge.urgent{background:rgba(139,58,10,.2);border-color:var(--rust);color:#ff9966;animation:pulse-urgent 2s infinite}
  @keyframes pulse-urgent{0%,100%{opacity:1}50%{opacity:.7}}
  .countdown-icon{font-size:.9rem}
  .suggestion-position{position:absolute;top:.5rem;left:.5rem;background:var(--gold);color:var(--black);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;font-weight:700;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .suggestion-position.gold{background:linear-gradient(135deg,#ffd700,#ffed4e);box-shadow:0 0 20px rgba(255,215,0,.4)}
  .suggestion-position.silver{background:linear-gradient(135deg,#c0c0c0,#e8e8e8);color:var(--black)}
  .suggestion-position.bronze{background:linear-gradient(135deg,#cd7f32,#e89a5c);color:var(--black)}

  /* FORMS */
  .form-card{background:linear-gradient(135deg,rgba(42,26,8,.6),rgba(19,15,9,.8));border:1px solid rgba(200,130,10,.2);border-radius:2px;padding:2rem}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
  .form-row.full{grid-template-columns:1fr}
  .form-row.three{grid-template-columns:1fr 1fr 1fr}
  .form-group{display:flex;flex-direction:column;gap:.4rem}
  label{font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--amber)}
  input,select,textarea{background:rgba(10,8,4,.8);border:1px solid rgba(200,130,10,.25);color:var(--cream);padding:.7rem .9rem;font-family:'Lora',serif;font-size:.9rem;border-radius:1px;outline:none;transition:border-color .2s;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 1px rgba(200,130,10,.15)}
  select option{background:var(--dark)}
  textarea{resize:vertical;min-height:90px}
  .btn{background:linear-gradient(135deg,var(--amber),var(--rust));color:var(--black);border:none;padding:.75rem 2rem;font-family:'Cinzel',serif;font-size:.8rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;border-radius:1px;transition:opacity .2s,transform .2s}
  .btn:hover{opacity:.88;transform:translateY(-1px)}
  .btn-ghost{background:transparent;border:1px solid rgba(200,130,10,.4);color:var(--amber);padding:.5rem 1.2rem;font-family:'Cinzel',serif;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:1px;transition:all .2s}
  .btn-ghost:hover{background:rgba(200,130,10,.1);border-color:var(--amber)}
  .btn-sm{padding:.45rem 1rem;font-size:.72rem}
  .btn-icon{background:rgba(200,130,10,.12);border:1px solid rgba(200,130,10,.25);color:var(--amber);padding:.3rem .6rem;cursor:pointer;border-radius:1px;font-size:.78rem;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
  .btn-icon:hover{background:rgba(200,130,10,.22)}

  /* POLLS */
  .poll-card{background:linear-gradient(135deg,rgba(42,26,8,.6),rgba(19,15,9,.8));border:1px solid rgba(200,130,10,.2);border-radius:2px;padding:1.5rem;margin-bottom:1.2rem}
  .poll-question{font-family:'Cinzel',serif;font-size:1rem;color:var(--cream);margin-bottom:1rem}
  .poll-options{display:flex;flex-direction:column;gap:.6rem}
  .poll-option input[type="radio"]{display:none}
  .poll-option-label{flex:1;display:flex;align-items:center;gap:.8rem;cursor:pointer;padding:.6rem .8rem;border:1px solid rgba(200,130,10,.15);border-radius:1px;transition:all .2s;font-size:.88rem}
  .poll-option-label:hover{border-color:rgba(200,130,10,.4);background:rgba(200,130,10,.05)}
  .poll-dot{width:14px;height:14px;border:2px solid rgba(200,130,10,.5);border-radius:50%;flex-shrink:0;transition:all .2s}
  .poll-option input[type="radio"]:checked+.poll-option-label .poll-dot{background:var(--amber);border-color:var(--amber);box-shadow:0 0 8px rgba(200,130,10,.5)}
  .poll-option input[type="radio"]:checked+.poll-option-label{border-color:var(--amber);background:rgba(200,130,10,.08)}
  .poll-bar-item{display:flex;align-items:flex-start;gap:.8rem;margin-bottom:.8rem;font-size:.82rem}
  .poll-bar-label{min-width:160px;color:var(--paper);padding-top:.1rem}
  .poll-bar-right{flex:1}
  .poll-bar-track{height:6px;background:rgba(200,130,10,.1);border-radius:3px;overflow:hidden;margin-bottom:.4rem}
  .poll-bar-fill{height:100%;background:linear-gradient(90deg,var(--rust),var(--gold));border-radius:3px;transition:width .6s ease}
  .poll-bar-pct{font-size:.78rem;color:var(--amber);margin-bottom:.3rem}
  .poll-voters{display:flex;flex-wrap:wrap;gap:.3rem}
  .voter-tag{background:rgba(42,26,8,.8);border:1px solid rgba(200,130,10,.2);color:var(--paper);font-size:.68rem;padding:.15rem .45rem;border-radius:1px;font-style:italic}
  .poll-status-open{font-size:.72rem;color:#6ee7b7;font-family:'Cinzel',serif;letter-spacing:.06em}
  .poll-status-closed{font-size:.72rem;color:#fca5a5;font-family:'Cinzel',serif;letter-spacing:.06em}
  .poll-deadline{font-size:.72rem;color:var(--smoke);font-style:italic}
  .poll-deadline.soon{color:#fde68a}
  .poll-winner{background:rgba(200,130,10,.12);border:1px solid rgba(200,130,10,.3);border-radius:1px;padding:.5rem .8rem;margin-top:.8rem;font-size:.82rem;color:var(--gold);font-family:'Cinzel',serif;letter-spacing:.05em}
  .poll-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;padding-top:.8rem;border-top:1px solid rgba(200,130,10,.1)}
  .poll-total{font-size:.75rem;color:var(--smoke);font-style:italic}
  .poll-my-vote{font-size:.75rem;color:var(--amber);font-style:italic}

  /* SETLIST */
  .setlist-panel{background:linear-gradient(135deg,rgba(42,26,8,.6),rgba(19,15,9,.8));border:1px solid rgba(200,130,10,.2);border-radius:2px;overflow:hidden}
  .setlist-panel-header{background:rgba(200,130,10,.08);padding:1rem 1.2rem;border-bottom:1px solid rgba(200,130,10,.15);display:flex;justify-content:space-between;align-items:center}
  .setlist-panel-title{font-family:'Cinzel',serif;font-size:.9rem;color:var(--gold)}
  .setlist-list{list-style:none;padding:.8rem 0;min-height:200px}
  .setlist-item{display:flex;align-items:center;gap:.8rem;padding:.6rem 1.2rem;transition:background .2s;font-size:.88rem}
  .setlist-item.editable{cursor:grab}
  .setlist-item:hover{background:rgba(200,130,10,.05)}
  .setlist-item.dragging{opacity:.5;cursor:grabbing}
  .setlist-num{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:rgba(200,130,10,.4);min-width:24px}
  .setlist-song{flex:1;color:var(--cream)}
  .setlist-artist{font-size:.75rem;color:var(--smoke);font-style:italic}
  .setlist-actions{display:flex;gap:.3rem;align-items:center}
  .setlist-remove{background:none;border:none;color:rgba(139,58,10,.4);cursor:pointer;font-size:.9rem;transition:color .2s;padding:.2rem}
  .setlist-remove:hover{color:var(--rust)}
  .setlist-add-row{padding:.8rem 1.2rem;border-top:1px solid rgba(200,130,10,.1);display:flex;gap:.5rem}
  .setlist-input{flex:1;background:rgba(10,8,4,.6);border:1px solid rgba(200,130,10,.2);color:var(--cream);padding:.5rem .7rem;font-size:.82rem;font-family:'Lora',serif;border-radius:1px;outline:none}
  .setlist-input:focus{border-color:var(--amber)}
  .setlist-add-btn{background:rgba(200,130,10,.15);border:1px solid rgba(200,130,10,.3);color:var(--amber);padding:.5rem .9rem;cursor:pointer;font-size:1rem;border-radius:1px;transition:all .2s}
  .setlist-add-btn:hover{background:rgba(200,130,10,.25)}

  /* REPERTÓRIO */
  .repertorio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.8rem}
  .rep-item{background:rgba(42,26,8,.5);border:1px solid rgba(200,130,10,.15);border-radius:1px;padding:.8rem 1.1rem;display:flex;align-items:center;gap:.8rem;transition:border-color .2s}
  .rep-item:hover{border-color:rgba(200,130,10,.35)}
  .rep-num{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:rgba(200,130,10,.3);min-width:28px}
  .rep-info{flex:1}
  .rep-song{color:var(--cream);font-size:.9rem}
  .rep-artist{font-size:.75rem;color:var(--smoke);font-style:italic}
  .rep-level{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .5rem;border-radius:1px;margin-left:.4rem}
  .rep-level.ok{background:rgba(30,100,30,.3);border:1px solid rgba(60,150,60,.3);color:#7ec87e}
  .rep-level.wip{background:rgba(100,80,10,.3);border:1px solid rgba(180,140,20,.3);color:#d4b84a}
  .rep-actions{display:flex;gap:.3rem}

  /* FORUM */
  .forum-sessions{display:flex;flex-direction:column;gap:1.2rem}
  .forum-thread{background:linear-gradient(135deg,rgba(42,26,8,.6),rgba(19,15,9,.8));border:1px solid rgba(200,130,10,.2);border-radius:2px;overflow:hidden}
  .forum-thread-header{padding:1.2rem 1.5rem;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background .2s;background:rgba(200,130,10,.04);border-bottom:1px solid rgba(200,130,10,.1)}
  .forum-thread-header:hover{background:rgba(200,130,10,.08)}
  .forum-thread-title{font-family:'Cinzel',serif;font-size:.95rem;color:var(--cream)}
  .forum-thread-meta{font-size:.72rem;color:var(--smoke);margin-top:.2rem;font-style:italic}
  .forum-chevron{color:var(--amber);font-size:.8rem;transition:transform .3s}
  .forum-chevron.open{transform:rotate(180deg)}
  .forum-body{display:none;padding:1.5rem}
  .forum-body.open{display:block}
  .forum-posts{display:flex;flex-direction:column;gap:1rem;margin-bottom:1.2rem}
  .forum-post{display:flex;gap:1rem;padding-bottom:1rem;border-bottom:1px solid rgba(200,130,10,.08)}
  .forum-post:last-child{border-bottom:none;padding-bottom:0}
  .post-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brown),var(--rust));display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold);flex-shrink:0;border:1px solid rgba(200,130,10,.25)}
  .post-content{flex:1}
  .post-meta{display:flex;gap:.6rem;align-items:baseline;margin-bottom:.4rem}
  .post-author{font-family:'Cinzel',serif;font-size:.82rem;color:var(--amber);font-weight:700}
  .post-date{font-size:.7rem;color:var(--smoke);font-style:italic}
  .post-text{font-size:.88rem;color:var(--paper);line-height:1.6}
  .post-reactions{display:flex;gap:.4rem;margin-top:.5rem}
  .react-btn{background:none;border:1px solid rgba(200,130,10,.15);color:var(--smoke);padding:.2rem .55rem;cursor:pointer;border-radius:1px;font-size:.78rem;transition:all .2s;display:flex;align-items:center;gap:.25rem;line-height:1}
  .react-btn:hover{border-color:rgba(200,130,10,.4)}
  .react-btn.liked{background:rgba(60,180,80,.12);border-color:rgba(60,180,80,.4);color:#6ee7b7}
  .react-btn.disliked{background:rgba(180,60,60,.12);border-color:rgba(180,60,60,.4);color:#fca5a5}
  .react-btn:disabled{opacity:.35;cursor:default}
  .forum-reply-form{display:flex;gap:.8rem;flex-wrap:wrap}

  /* SUGGESTIONS */
  .suggestions-list{display:flex;flex-direction:column;gap:.6rem;margin-top:1.5rem}
  .suggestion-item{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.2rem;background:rgba(42,26,8,.5);border:1px solid rgba(200,130,10,.15);border-radius:1px;transition:all .2s;font-size:.88rem;flex-wrap:wrap;position:relative}
  .suggestion-item:hover{border-color:rgba(200,130,10,.35)}
  .suggestion-item.rank-1{border-color:rgba(255,200,0,.4);background:rgba(255,200,0,.04)}
  .suggestion-item.rank-2{border-color:rgba(192,192,192,.35);background:rgba(192,192,192,.03)}
  .suggestion-item.rank-3{border-color:rgba(180,100,20,.4);background:rgba(180,100,20,.04)}
  .suggestion-trophy{font-size:1.3rem;flex-shrink:0;line-height:1}
  .suggestion-rank{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:rgba(200,130,10,.3);min-width:24px;flex-shrink:0}
  .suggestion-main{flex:1;min-width:160px}
  .suggestion-song{color:var(--cream);font-weight:600}
  .suggestion-artist{font-size:.78rem;color:var(--smoke);font-style:italic;margin-top:.15rem}
  .suggestion-note{font-size:.75rem;color:var(--smoke);font-style:italic;margin-top:.15rem}
  .suggestion-by{font-size:.72rem;color:var(--amber);min-width:80px}
  .suggestion-actions{display:flex;gap:.4rem;align-items:center}
  .suggestion-score{display:flex;align-items:center;gap:.3rem}
  .vote-btn{background:none;border:1px solid rgba(200,130,10,.2);color:var(--smoke);padding:.3rem .6rem;cursor:pointer;border-radius:1px;font-size:.82rem;transition:all .2s;display:flex;align-items:center;gap:.3rem;line-height:1}
  .vote-btn:hover{border-color:rgba(200,130,10,.5)}
  .vote-btn.liked{background:rgba(60,180,80,.15);border-color:rgba(60,180,80,.5);color:#6ee7b7}
  .vote-btn.disliked{background:rgba(180,60,60,.15);border-color:rgba(180,60,60,.5);color:#fca5a5}
  .vote-btn:disabled{opacity:.4;cursor:default}
  .score-num{font-family:'Bebas Neue',sans-serif;font-size:.95rem;min-width:20px;text-align:center}

  /* TABS */
  .tabs{display:flex;margin-bottom:2rem;border-bottom:1px solid rgba(200,130,10,.2)}
  .tab-btn{background:none;border:none;color:var(--smoke);padding:.7rem 1.5rem;font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.1em;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;text-transform:uppercase;margin-bottom:-1px}
  .tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
  .tab-btn:hover:not(.active){color:var(--paper)}

  /* TOAST */
  .toast{position:fixed;bottom:2rem;right:2rem;background:linear-gradient(135deg,var(--brown),rgba(19,15,9,.95));border:1px solid var(--amber);color:var(--cream);padding:1rem 1.5rem;border-radius:2px;font-size:.85rem;z-index:10000;transform:translateY(100px);opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 32px rgba(0,0,0,.5)}
  .toast.show{transform:translateY(0);opacity:1}

  /* GOOGLE BTN */
  .btn-google{display:flex;align-items:center;justify-content:center;gap:.8rem;width:100%;padding:.8rem 1.5rem;background:#fff;color:#3c3c3c;border:1px solid #ddd;border-radius:2px;font-family:'Cinzel',serif;font-size:.82rem;font-weight:700;letter-spacing:.1em;cursor:pointer;transition:background .2s,box-shadow .2s}
  .btn-google:hover{background:#f5f5f5;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .btn-google svg{flex-shrink:0}
  .login-divider{display:flex;align-items:center;gap:.8rem;margin:1.2rem 0;color:var(--smoke);font-size:.75rem}
  .login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:rgba(200,130,10,.2)}
  .access-denied{text-align:center;padding:1rem 0}
  .access-denied p{color:#e06060;font-size:.85rem;margin-bottom:1rem}

  /* MODALS */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;padding:1rem;overflow-y:auto}
  .modal-overlay.show{opacity:1;pointer-events:all}
  .modal{background:linear-gradient(135deg,rgba(42,26,8,.98),rgba(19,15,9,.99));border:1px solid rgba(200,130,10,.4);border-radius:2px;padding:2.5rem;width:100%;max-width:400px;position:relative;margin:auto}
  .modal-wide{max-width:540px}
  .modal-title{font-family:'Cinzel',serif;font-size:1.4rem;font-weight:700;color:var(--gold);margin-bottom:.5rem;text-align:center}
  .modal-subtitle{font-size:.8rem;color:var(--smoke);text-align:center;margin-bottom:2rem;font-style:italic}
  .modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;color:var(--smoke);cursor:pointer;font-size:1.2rem;transition:color .2s}
  .modal-close:hover{color:var(--cream)}
  .modal-error{color:#e06060;font-size:.8rem;margin-top:.5rem;display:none;text-align:center}
  .modal-error.show{display:block}

  /* AUTH */
  .member-only{display:none}
  body.logged-in .member-only{display:block}
  body.logged-in .member-only-flex{display:flex}
  .member-only-flex{display:none}
  .member-admin-only{display:none}
  body.is-member .member-admin-only{display:block}
  body.is-member .member-admin-only-flex{display:flex}
  .member-admin-only-flex{display:none}

  /* TOCA DO MINEIRO */
  .toca-badge{display:flex;align-items:center;gap:1rem;background:rgba(10,8,4,.6);border:1px solid rgba(200,130,10,.25);border-radius:2px;padding:.8rem 1.2rem;margin-top:2rem;width:fit-content;margin-left:auto;margin-right:auto;animation:fadeUp 1.2s .8s ease both}
  .toca-badge img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1px solid rgba(200,130,10,.35)}
  .toca-badge-text{text-align:left}
  .toca-badge-name{font-family:'Cinzel',serif;font-size:.85rem;color:var(--gold);letter-spacing:.08em}
  .toca-badge-sub{font-size:.7rem;color:var(--smoke);font-style:italic;margin-top:.15rem}

  /* ── LIGHTBOX ── */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:8000;display:none;align-items:center;justify-content:center;flex-direction:column;padding:1rem;opacity:0;transition:opacity .3s}
  .lightbox.open{display:flex;opacity:1}
  .lightbox-close{position:absolute;top:.8rem;right:1.2rem;background:none;border:none;color:var(--cream);cursor:pointer;font-size:1.8rem;z-index:8010;transition:color .2s}
  .lightbox-close:hover{color:var(--gold)}
  .lightbox-inner{display:flex;gap:1.2rem;max-width:95vw;max-height:90vh;overflow:hidden;align-items:stretch}
  .lb-img-panel{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;flex-shrink:0;max-width:65vw;padding-right:.5rem}
  .lb-img-panel .lightbox-img{width:100%;max-height:70vh;object-fit:contain;border:1px solid rgba(200,130,10,.2);border-radius:2px}
  .lb-caption-block{text-align:center;margin-top:.6rem;width:100%;flex-shrink:0;padding-top:.4rem}
  .lb-caption-block p{font-family:'Lora',serif;font-size:.9rem;color:var(--cream);font-style:italic}
  .lb-meta{font-size:.7rem;color:var(--smoke);margin-top:.2rem}
  .lightbox-reactions{display:flex;gap:.5rem;align-items:center;margin-top:.5rem}
  .lb-rbtn{background:none;border:1px solid rgba(200,130,10,.2);color:var(--smoke);padding:.3rem .65rem;cursor:pointer;border-radius:1px;font-size:.82rem;transition:all .2s;display:flex;align-items:center;gap:.3rem}
  .lb-rbtn:hover{border-color:rgba(200,130,10,.5)}
  .lb-rbtn.cl{background:rgba(60,180,80,.18);border-color:rgba(60,180,80,.5);color:#6ee7b7}
  .lb-rbtn.di{background:rgba(180,60,60,.18);border-color:rgba(180,60,60,.5);color:#fca5a5}
  .lb-rbtn:disabled{opacity:.35;cursor:default}
  .lb-comments-wrap{width:280px;flex-shrink:0;max-height:85vh;overflow-y:auto;border:1px solid rgba(200,130,10,.15);border-radius:2px;padding:.7rem;background:rgba(10,8,4,.5)}
  .lb-comments-wrap::-webkit-scrollbar{width:4px}
  .lb-comments-wrap::-webkit-scrollbar-thumb{background:rgba(200,130,10,.3);border-radius:2px}
  .lb-ctitle{font-family:'Cinzel',serif;font-size:.78rem;color:var(--amber);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.6rem}
  .lb-cmt{padding:.45rem 0;border-bottom:1px solid rgba(200,130,10,.06)}
  .lb-cmt:last-child{border-bottom:none;padding-bottom:0}
  .lb-cmt-l1{display:flex;align-items:center;gap:.4rem;margin-bottom:.2rem}
  .lb-cmt-av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--brown),var(--rust));display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:.6rem;color:var(--gold);flex-shrink:0;border:1px solid rgba(200,130,10,.15)}
  .lb-cmt-au{font-family:'Cinzel',serif;font-size:.75rem;color:var(--amber);font-weight:600}
  .lb-cmt-dt{font-size:.6rem;color:var(--smoke);font-style:italic}
  .lb-cmt-txt{font-size:.82rem;color:var(--paper);line-height:1.45;margin-bottom:.3rem}
  .lb-cmt-act{display:flex;gap:.35rem;align-items:center}
  .lb-cr{background:none;border:1px solid rgba(200,130,10,.12);color:var(--smoke);padding:.12rem .4rem;cursor:pointer;border-radius:1px;font-size:.68rem;transition:all .2s;display:flex;align-items:center;gap:.2rem}
  .lb-cr:hover{border-color:rgba(200,130,10,.4)}
  .lb-cr.lkd{background:rgba(60,180,80,.15);border-color:rgba(60,180,80,.4);color:#6ee7b7}
  .lb-cr.dkd{background:rgba(180,60,60,.15);border-color:rgba(180,60,60,.4);color:#fca5a5}
  .lb-cr:disabled{opacity:.35;cursor:default}
  .lb-cdel{background:none;border:none;color:rgba(139,58,10,.4);cursor:pointer;font-size:.7rem;transition:color .2s;padding:.1rem .3rem}
  .lb-cdel:hover{color:var(--rust)}
  .lb-rpbtn{background:none;border:1px solid rgba(200,130,10,.15);color:var(--smoke);padding:.1rem .4rem;cursor:pointer;border-radius:1px;font-size:.65rem;transition:all .2s;font-family:'Cinzel',serif}
  .lb-rpbtn:hover{border-color:rgba(200,130,10,.5);color:var(--paper)}
  .lb-rpform{margin-top:.4rem;display:flex;gap:.4rem}
  .lb-rpform input{flex:1;background:rgba(10,8,4,.5);border:1px solid rgba(200,130,10,.2);color:var(--cream);padding:.3rem .5rem;font-size:.75rem;font-family:'Lora',serif;border-radius:1px;outline:none;min-width:0}
  .lb-rpform input:focus{border-color:var(--amber)}
  .lb-rpform button{background:rgba(200,130,10,.12);border:1px solid rgba(200,130,10,.3);color:var(--amber);padding:.25rem .6rem;cursor:pointer;border-radius:1px;font-size:.68rem;font-family:'Cinzel',serif;white-space:nowrap}
  .lb-rpform button:hover{background:rgba(200,130,10,.22)}
  .lb-replies-box{margin-left:1.8rem;margin-top:.3rem;border-left:2px solid rgba(200,130,10,.1);padding-left:.5rem}
  .lb-rp{text-align:center;color:var(--smoke);font-size:.78rem;font-style:italic}
  .lb-login-hint{text-align:center;padding:.6rem 0;display:flex;flex-direction:column;gap:.4rem}
  .lb-login-btn{background:linear-gradient(135deg,var(--amber),var(--rust));color:var(--black);border:none;padding:.55rem 1.3rem;font-family:'Cinzel',serif;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:1px;transition:opacity .2s;align-self:center}
  .lb-login-btn:hover{opacity:.85}
  body.lb-no-scroll{overflow:hidden}

  /* FORUM REPLIES */
  .forum-replies{margin-left:2rem;margin-top:.5rem;border-left:2px solid rgba(200,130,10,.12);padding-left:.8rem}
  .frp{padding:.5rem 0;border-bottom:1px solid rgba(200,130,10,.06)}
  .frp:last-child{border-bottom:none}
  .frp-act{display:flex;gap:.35rem;align-items:center;margin-top:.35rem}
