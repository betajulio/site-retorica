<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retórica | Classic Rock</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap');
        body { background-color: #121212; color: #f5f5f5; font-family: 'Roboto', sans-serif; margin: 0; scroll-behavior: smooth; }
        h1, h2, h3 { font-family: 'Oswald', sans-serif; text-transform: uppercase; color: #d32f2f; }
        header { text-align: center; padding: 80px 20px; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1493225255756-d9584f8606e9?auto=format&fit=crop&w=1350&q=80') center/cover; border-bottom: 3px solid #d32f2f; }
        .quick-access { display: flex; justify-content: center; gap: 20px; margin-top: -30px; padding-bottom: 40px; flex-wrap: wrap; }
        .btn-main { background-color: #d32f2f; color: white; padding: 15px 25px; text-decoration: none; font-family: 'Oswald', sans-serif; font-size: 1.1em; border-radius: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; border: none; cursor: pointer; }
        .btn-main:hover { transform: scale(1.05); background-color: #b71c1c; }
        nav { background: #000; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; }
        nav a { color: #fff; text-decoration: none; margin: 0 15px; font-family: 'Oswald'; font-weight: bold; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        section { background-color: #1e1e1e; padding: 30px; margin-bottom: 30px; border-radius: 8px; border-left: 5px solid #d32f2f; }
        #setlist-content, #repertorio-content { line-height: 1.6; font-size: 1.1em; }
        .photo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .photo-item { width: 100%; border-radius: 4px; border: 2px solid #333; }
    </style>
</head>
<body>

<header>
    <h1>RETÓRICA</h1>
    <p>Classic Rock Management | Itaquaquecetuba</p>
</header>

<div class="quick-access">
    <a href="#ensaio" class="btn-main">🎸 ENSAIO DA SEMANA</a>
    <a href="#repertorio" class="btn-main">🎼 REPERTÓRIO</a>
    <button onclick="netlifyIdentity.open()" class="btn-main" style="background:#333">🔐 LOGIN ADMIN</button>
</div>

<nav>
    <a href="#ensaio">ENSAIO</a>
    <a href="#repertorio">REPERTÓRIO</a>
    <a href="#fotos">FOTOS</a>
</nav>

<div class="container">
    <section id="ensaio">
        <h2>Próximo Ensaio</h2>
        <div id="setlist-content">Carregando detalhes do ensaio...</div>
    </section>

    <section id="repertorio">
        <h2>Repertório Atual</h2>
        <div id="repertorio-content">O repertório da banda aparecerá aqui.</div>
    </section>

    <section id="fotos">
        <h2>Galeria de Fotos</h2>
        <div class="photo-gallery" id="gallery-content">
            <p>As fotos da Toca do Mineiro aparecerão aqui.</p>
        </div>
    </section>
</div>

<script>
    // 1. Script para carregar o Setlist da Semana
    fetch('/conteudo/ensaio_atual.md')
        .then(response => response.text())
        .then(text => {
            // Remove o cabeçalho do arquivo (frontmatter) e foca no conteúdo
            const content = text.split('---').pop();
            document.getElementById('setlist-content').innerHTML = marked.parse(content);
        })
        .catch(err => {
            document.getElementById('setlist-content').innerHTML = "<p>Crie o primeiro ensaio no painel administrativo.</p>";
        });

    // 2. Lógica do Login Administrativo
    if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
            if (!user) {
                window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
            }
        });
    }
</script>

</body>
</html>
