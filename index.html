<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retórica — Classic Rock</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;700;900&family=IM+Fell+English+SC&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{--black:#0a0804;--dark:#130f09;--brown:#2a1a08;--amber:#c8820a;--gold:#e8a820;--cream:#f0e4c8;--rust:#8b3a0a;--paper:#d4c4a0;--smoke:#6b6050}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--black);color:var(--cream);font-family:'Lora',serif;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.4}

  /* NAV */
  nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:linear-gradient(180deg,rgba(10,8,4,.98),rgba(10,8,4,.85));border-bottom:1px solid rgba(200,130,10,.3);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:60px;backdrop-filter:blur(10px)}
  .nav-logo{font-family:'Cinzel',serif;font-size:1.4rem;font-weight:900;color:var(--gold);letter-spacing:.15em}
  .nav-links{display:flex;list-style:none}
  .nav-links a{color:var(--paper);text-decoration:none;font-family:'Lora',serif;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:.5rem .7rem;transition:color .2s;cursor:pointer}
  .nav-links a:hover{color:var(--gold)}
  .nav-auth{display:flex;align-items:center;gap:.8rem}
  .nav-user{font-size:.75rem;color:var(--amber);font-family:'Cinzel',serif;letter-spacing:.08em}

  /* HERO */
  #hero{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 60%,rgba(200,130,10,.08) 0%,transparent 70%),radial-gradient(ellipse 40% 40% at 20% 80%,rgba(139,58,10,.12) 0%,transparent 60%)}
  .hero-lines{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(200,130,10,.04) 59px,rgba(200,130,10,.04) 60px)}
  .hero-content{position:relative;text-align:center;animation:fadeUp 1.2s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
  .hero-tag{font-family:'IM Fell English SC',serif;font-size:.85rem;letter-spacing:.4em;color:var(--amber);text-transform:uppercase;margin-bottom:1.5rem}
  .hero-title{font-family:'Cinzel',serif;font-size:clamp(2.5rem,10vw,7rem);font-weight:900;color:var(--cream);line-height:1.1;text-shadow:0 0 80px rgba(200,130,10,.3),3px 3px 0 rgba(139,58,10,.4);animation:fadeUp 1.2s .2s ease both}
  .hero-subtitle{font-family:'IM Fell English SC',serif;font-size:1rem;letter-spacing:.5em;color:var(--smoke);margin-top:1.5rem;animation:fadeUp 1.2s .4s ease both}
  .hero-divider{display:flex;align-items:center;gap:1rem;margin:2rem auto;width:300px;animation:fadeUp 1.2s .6s ease both}
  .hero-divider::before{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--amber))}
  .hero-divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--amber),transparent)}
  .hero-diamond{width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
  .scroll-hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5rem;color:var(--smoke);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;animation:bounce 2s infinite}
  .scroll-arrow{width:1px;height:30px;background:linear-gradient(180deg,transparent,var(--amber))}
  @keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}

  /* SECTIONS */
  section{padding:6rem 2rem;max-width:1100px;margin:0 auto}
  .section-header{display:flex;align-items:center;gap:1.5rem;margin-bottom:3.5rem}
  .section-number{font-family:'Bebas Neue',sans-serif;font-size:4rem;color:rgba(200,130,10,.2);line-height:1;min-width:60px}
  .section-title-wrap h2{font-family:'Cinzel',serif;font-size:2rem;font-weight:700;color:var(--cream);letter-spacing:.05em}
  .section-title-wrap p{color:var(--smoke);font-size:.85rem;letter-spacing:.1em;margin-top:.3rem;text-transform:uppercase}
  .section-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(200,130,10,.4),transparent)}
  .full-divider{border:none;height:1px;background:linear-gradient(90deg,transparent,rgba(200,130,10,.2),transparent);max-width:1100px;margin:0 auto}

  /* MEMBERS */
  .members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.5rem}
  .member-card{background:linear-gradient(135deg,rgba(42,26,8,.8),rgba(19,15,9,.9));border:1px solid rgba(200,130,10,.2);border-radius:2px;padding:1.5rem 1.2rem;text-align:center;transition:border-color .3s,transform .3s;position:relative;overflow:hidden}
  .member-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent);opacity:0;transition:opacity .3s}
  .member-card:hover{border-color:rgba(200,130,10,.5);transform:translateY(-3px)}
  .member-card:hover::before{opacity:1}
  .member-card.editable{cursor:pointer}
  .member-edit-hint{position:absolute;bottom:0;left:0;right:0;background:rgba(200,130,10,.12);color:var(--amber);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;padding:.35rem;opacity:0;transition:opacity .2s;font-family:'Cinzel',serif}
  .member-card.editable:hover .member-edit-hint{opacity:1}
  .member-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--brown),var(--rust));margin:0 auto 1rem;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:1.6rem;color:var(--gold);border:2px solid rgba(200,130,10,.3);overflow:hidden}
  .member-avatar img{width:100%;height:100%;object-fit:cover}
  .member-name{font-family:'Cinzel',serif;font-size:.95rem;font-weight:700;color:var(--cream);margin-bottom:.5rem}
  .member-instruments{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;margin-bottom:.4rem}
  .instrument-tag{background:rgba(200,130,10,.12);border:1px solid rgba(200,130,10,.3);color:var(--amber);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;border-radius:1px}
  .member-since{font-size:.7rem;color:var(--smoke);margin-top:.3rem;font-style:italic}
  .remove-btn{position:absolute;top:.5rem;right:.5rem;background:none;border:none;color:rgba(139,58,10,.5);cursor:pointer;font-size:1rem;transition:color .2s;line-height:1;z-index:2}
  .remove-btn:hover{color:var(--rust)}
  .inst-cb{display:none}
  .inst-label{background:rgba(10,8,4,.6);border:1px solid rgba(200,130,10,.2);color:var(--smoke);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:.35rem .7rem;border-radius:1px;cursor:pointer;transition:all .2s;user-select:none}
  .inst-cb:checked+.inst-label{background:rgba(200,130,10,.15);border-color:var(--amber);color:var(--amber)}
  .instruments-check{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.3rem}
  .img-upload-area{border:1px dashed rgba(200,130,10,.3);border-radius:2px;padding:1rem;text-align:center;cursor:pointer;transition:border-color .2s;position:relative}
  .img-upload-area:hover{border-color:var(--amber)}
  .img-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .img-preview{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid rgba(200,130,10,.3);margin:0 auto .5rem;display:none}
  .img-upload-hint{font-size:.75rem;color:var(--smoke);font-style:italic}

  /* FORMS */
  .form-card{background:linear-gradient(135deg,rgba(42,26,8,.6),rgba(19,15,9,.8));border:1px solid rgba(200,130,10,.2);border-radius:2px;padding:2rem}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
  .form-row.full{grid-template-columns:1fr}
  .form-row.three{grid-template-columns:1fr 1fr 1fr}
  .form-group{display:flex;flex-direction:column;gap:.4rem}
  label{font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--amber)}
  input,select,textarea{background:rgba(10,8,4,.8);border:1px solid rgba(200,130,10,.25);color:var(--cream);padding:.7rem .9rem;font-family:'Lora',serif;font-size:.9rem;border-radius:1px;outline:none;transition:border-color .2s;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 1px rgba(200,130,10,.15)}
  select option{background:var(--dark)}
  textarea{resize:vertical;min-height:90px}
  .btn{background:linear-gradient(135deg,var(--amber),var(--rust));color:var(--black);border:none;padding:.75rem 2rem;font-family:'Cinzel',serif;font-size:.8rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;border-radius:1px;transition:opacity .2s,transform .2s}
  .btn:hover{opacity:.88;transform:translateY(-1px)}
  .btn-ghost{background:transparent;border:1px solid rgba(200,130,10,.4);color:var(--amber);padding:.5rem 1.2rem;font-family:'Cinzel',serif;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:1px;transition:all .2s}
  .btn-ghost:hover{background:rgba(200,130,10,.1);border-color:var(--amber)}
  .btn-sm{padding:.45rem 1rem;font-size:.72rem}
  .btn-icon{background:rgba(200,130,10,.12);border:1px solid rgba(200,130,10,.25);color:var(--amber);padding:.3rem .6rem;cursor:pointer;border-radius:1px;font-size:.78rem;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
  .btn-icon:hover{background:rgba(200,130,10,.22)}

  /* POLLS */
  .poll-card{background:linear-gradient(135deg,rgba(42,26,8,.6),rgba(19,15,9,.8));border:1px solid rgba(200,130,10,.2);border-radius:2px;padding:1.5rem;margin-bottom:1.2rem}
  .poll-question{font-family:'Cinzel',serif;font-size:1rem;color:var(--cream);margin-bottom:1rem}
  .poll-options{display:flex;flex-direction:column;gap:.6rem}
  .poll-option input[type="radio"]{display:none}
  .poll-option-label{flex:1;display:flex;align-items:center;gap:.8rem;cursor:pointer;padding:.6rem .8rem;border:1px solid rgba(200,130,10,.15);border-radius:1px;transition:all .2s;font-size:.88rem}
  .poll-option-label:hover{border-color:rgba(200,130,10,.4);background:rgba(200,130,10,.05)}
  .poll-dot{width:14px;height:14px;border:2px solid rgba(200,130,10,.5);border-radius:50%;flex-shrink:0;transition:all .2s}
  .poll-option input[type="radio"]:checked+.poll-option-label .poll-dot{background:var(--amber);border-color:var(--amber);box-shadow:0 0 8px rgba(200,130,10,.5)}
  .poll-option input[type="radio"]:checked+.poll-option-label{border-color:var(--amber);background:rgba(200,130,10,.08)}
  .poll-bar-item{display:flex;align-items:flex-start;gap:.8rem;margin-bottom:.8rem;font-size:.82rem}
  .poll-bar-label{min-width:160px;color:var(--paper);padding-top:.1rem}
  .poll-bar-right{flex:1}
  .poll-bar-track{height:6px;background:rgba(200,130,10,.1);border-radius:3px;overflow:hidden;margin-bottom:.4rem}
  .poll-bar-fill{height:100%;background:linear-gradient(90deg,var(--rust),var(--gold));border-radius:3px;transition:width .6s ease}
  .poll-bar-pct{font-size:.78rem;color:var(--amber);margin-bottom:.3rem}
  .poll-voters{display:flex;flex-wrap:wrap;gap:.3rem}
  .voter-tag{background:rgba(42,26,8,.8);border:1px solid rgba(200,130,10,.2);color:var(--paper);font-size:.68rem;padding:.15rem .45rem;border-radius:1px;font-style:italic}
  .poll-footer{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;padding-top:.8rem;border-top:1px solid rgba(200,130,10,.1)}
  .poll-total{font-size:.75rem;color:var(--smoke);font-style:italic}
  .poll-my-vote{font-size:.75rem;color:var(--amber);font-style:italic}

  /* SETLIST */
  .setlist-panel{background:linear-gradient(135deg,rgba(42,26,8,.6),rgba(19,15,9,.8));border:1px solid rgba(200,130,10,.2);border-radius:2px;overflow:hidden}
  .setlist-panel-header{background:rgba(200,130,10,.08);padding:1rem 1.2rem;border-bottom:1px solid rgba(200,130,10,.15);display:flex;justify-content:space-between;align-items:center}
  .setlist-panel-title{font-family:'Cinzel',serif;font-size:.9rem;color:var(--gold)}
  .setlist-list{list-style:none;padding:.8rem 0;min-height:200px}
  .setlist-item{display:flex;align-items:center;gap:.8rem;padding:.6rem 1.2rem;transition:background .2s;font-size:.88rem}
  .setlist-item.editable{cursor:grab}
  .setlist-item:hover{background:rgba(200,130,10,.05)}
  .setlist-item.dragging{opacity:.5;cursor:grabbing}
  .setlist-num{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:rgba(200,130,10,.4);min-width:24px}
  .setlist-song{flex:1;color:var(--cream)}
  .setlist-artist{font-size:.75rem;color:var(--smoke);font-style:italic}
  .setlist-actions{display:flex;gap:.3rem;align-items:center}
  .setlist-remove{background:none;border:none;color:rgba(139,58,10,.4);cursor:pointer;font-size:.9rem;transition:color .2s;padding:.2rem}
  .setlist-remove:hover{color:var(--rust)}
  .setlist-add-row{padding:.8rem 1.2rem;border-top:1px solid rgba(200,130,10,.1);display:flex;gap:.5rem}
  .setlist-input{flex:1;background:rgba(10,8,4,.6);border:1px solid rgba(200,130,10,.2);color:var(--cream);padding:.5rem .7rem;font-size:.82rem;font-family:'Lora',serif;border-radius:1px;outline:none}
  .setlist-input:focus{border-color:var(--amber)}
  .setlist-add-btn{background:rgba(200,130,10,.15);border:1px solid rgba(200,130,10,.3);color:var(--amber);padding:.5rem .9rem;cursor:pointer;font-size:1rem;border-radius:1px;transition:all .2s}
  .setlist
