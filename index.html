<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retórica | Gestão de Banda</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap');

        body { background-color: #121212; color: #f5f5f5; font-family: 'Roboto', sans-serif; margin: 0; }
        h1, h2, h3 { font-family: 'Oswald', sans-serif; text-transform: uppercase; color: #d32f2f; }
        
        header {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1493225255756-d9584f8606e9?auto=format&fit=crop&w=1350&q=80') center/cover;
            border-bottom: 3px solid #d32f2f;
        }

        .quick-access {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: -30px;
            padding-bottom: 40px;
        }

        .btn-main {
            background-color: #d32f2f;
            color: white;
            padding: 20px 30px;
            text-decoration: none;
            font-family: 'Oswald', sans-serif;
            font-size: 1.2em;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .btn-main:hover { transform: scale(1.05); background-color: #b71c1c; }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        
        section { 
            background-color: #1e1e1e; 
            padding: 30px; 
            margin-bottom: 30px; 
            border-radius: 8px;
        }

        /* Grid de Fotos */
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .photo-item {
            width: 100%;
            height: 200px;
            background-color: #333;
            border-radius: 4px;
            object-fit: cover;
        }

        nav { background: #000; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; }
        nav a { color: #fff; text-decoration: none; margin: 0 15px; font-family: 'Oswald'; }
    </style>
</head>
<body>

<header>
    <h1>RETÓRICA</h1>
    <p>A Toca do Mineiro | Classic Rock Management</p>
</header>

<div class="quick-access">
    <a href="#ensaio" class="btn-main">🎸 SETLIST DO ENSAIO</a>
    <a href="#repertorio" class="btn-main">🎼 REPERTÓRIO COMPLETO</a>
</div>

<nav>
    <a href="#membros">MEMBROS</a>
    <a href="#fotos">FOTOS</a>
    <a href="#admin">PAINEL SEGURO</a>
</nav>

<div class="container">
    <section id="membros">
        <h2>Membros Atuais</h2>
        <div id="lista-membros">
            <p>Carregando integrantes...</p>
        </div>
    </section>

    <section id="fotos">
        <h2>Galeria de Fotos</h2>
        <div class="photo-gallery">
            <img src="sua-foto-aqui.jpg" class="photo-item" alt="Ensaio Retórica">
            <div class="photo-item" style="display:flex; align-items:center; justify-content:center;">+ Adicionar Foto</div>
        </div>
    </section>

    <section id="admin" style="border: 1px solid #333; text-align: center;">
        <h2>Gestão Interna</h2>
        <p>Acesso restrito para edição de setlist e membros.</p>
        <button id="login-button" style="padding: 10px 20px; cursor: pointer;">Login Administrativo</button>
    </section>
</div>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
</body>
</html>
