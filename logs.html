<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retórica — Logs</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{--black:#0a0804;--dark:#130f09;--brown:#2a1a08;--amber:#c8820a;--gold:#e8a820;--cream:#f0e4c8;--rust:#8b3a0a;--paper:#d4c4a0;--smoke:#6b6050}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--black);color:var(--cream);font-family:'Lora',serif;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.4}

  /* NAV */
  nav{background:linear-gradient(180deg,rgba(10,8,4,.98),rgba(10,8,4,.85));border-bottom:1px solid rgba(200,130,10,.3);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:60px;backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
  .nav-logo{font-family:'Cinzel',serif;font-size:1.2rem;font-weight:900;color:var(--gold);letter-spacing:.15em;text-decoration:none}
  .nav-back{font-family:'Cinzel',serif;font-size:.75rem;color:var(--amber);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border:1px solid rgba(200,130,10,.3);padding:.4rem .9rem;border-radius:1px;transition:all .2s}
  .nav-back:hover{background:rgba(200,130,10,.1);border-color:var(--amber)}

  /* LAYOUT */
  main{max-width:1000px;margin:0 auto;padding:3rem 1.5rem}

  /* HEADER */
  .page-header{margin-bottom:2.5rem}
  .page-title{font-family:'Cinzel',serif;font-size:2rem;font-weight:700;color:var(--cream);margin-bottom:.4rem}
  .page-sub{font-size:.82rem;color:var(--smoke);font-style:italic}

  /* LOGIN WALL */
  #loginWall{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:1.5rem;text-align:center}
  .lock-icon{font-size:3rem;opacity:.4}
  .login-title{font-family:'Cinzel',serif;font-size:1.3rem;color:var(--cream)}
  .login-sub{font-size:.85rem;color:var(--smoke);font-style:italic}
  .btn-google{display:flex;align-items:center;justify-content:center;gap:.8rem;padding:.8rem 1.8rem;background:#fff;color:#3c3c3c;border:1px solid #ddd;border-radius:2px;font-family:'Cinzel',serif;font-size:.82rem;font-weight:700;letter-spacing:.1em;cursor:pointer;transition:background .2s,box-shadow .2s}
  .btn-google:hover{background:#f5f5f5;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .btn-ghost{background:transparent;border:1px solid rgba(200,130,10,.4);color:var(--amber);padding:.5rem 1.2rem;font-family:'Cinzel',serif;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:1px;transition:all .2s}
  .btn-ghost:hover{background:rgba(200,130,10,.1)}
  .denied-msg{color:#e06060;font-size:.85rem}

  /* FILTERS */
  #logContent{display:none}
  .filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;align-items:center}
  .filter-btn{background:rgba(10,8,4,.8);border:1px solid rgba(200,130,10,.2);color:var(--smoke);padding:.35rem .9rem;font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:1px;transition:all .2s}
  .filter-btn:hover{border-color:rgba(200,130,10,.5);color:var(--paper)}
  .filter-btn.active{background:rgba(200,130,10,.15);border-color:var(--amber);color:var(--amber)}
  .filter-search{background:rgba(10,8,4,.8);border:1px solid rgba(200,130,10,.2);color:var(--cream);padding:.35rem .8rem;font-family:'Lora',serif;font-size:.82rem;border-radius:1px;outline:none;transition:border-color .2s;flex:1;min-width:160px;max-width:280px}
  .filter-search:focus{border-color:var(--amber)}
  .filter-count{font-size:.75rem;color:var(--smoke);font-style:italic;margin-left:auto}

  /* STATS */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.8rem;margin-bottom:2rem}
  .stat-card{background:linear-gradient(135deg,rgba(42,26,8,.7),rgba(19,15,9,.8));border:1px solid rgba(200,130,10,.15);border-radius:1px;padding:.9rem 1rem;text-align:center}
  .stat-num{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--gold);line-height:1}
  .stat-label{font-size:.65rem;color:var(--smoke);letter-spacing:.1em;text-transform:uppercase;margin-top:.2rem}

  /* DETAIL PANELS */
  .detail-section{margin-bottom:2rem}
  .detail-title{font-family:'Cinzel',serif;font-size:.95rem;color:var(--amber);letter-spacing:.08em;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
  .detail-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(200,130,10,.3),transparent)}
  .metric-row{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}
  .metric-card{flex:1;min-width:180px;background:linear-gradient(135deg,rgba(42,26,8,.5),rgba(19,15,9,.7));border:1px solid rgba(200,130,10,.12);border-radius:1px;padding:1rem 1.2rem}
  .metric-label{font-size:.7rem;color:var(--smoke);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.3rem}
  .metric-value{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--cream);line-height:1}
  .metric-value.gold{color:var(--gold)}
  .metric-bar{height:4px;background:rgba(200,130,10,.1);border-radius:2px;margin-top:.5rem;overflow:hidden}
  .metric-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--amber),var(--gold))}
  .top-table{width:100%;border-collapse:collapse}
  .top-table td{padding:.5rem .8rem;font-size:.8rem;border-bottom:1px solid rgba(200,130,10,.06)}
  .top-table td:first-child{color:var(--gold);font-family:'Bebas Neue',sans-serif;font-size:1rem;text-align:center;width:32px}
  .top-table td:nth-child(2){color:var(--cream)}
  .top-table td:last-child{text-align:right;color:var(--smoke);font-size:.75rem}

  /* LOG TABLE */
  .log-table{width:100%;border-collapse:collapse}
  .log-table th{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);padding:.6rem 1rem;border-bottom:1px solid rgba(200,130,10,.25);text-align:left;background:rgba(42,26,8,.4);position:relative}
  .sort-header{cursor:pointer;user-select:none;transition:color .15s}
  .sort-header:hover{color:var(--gold)!important}
  .sort-arrow{display:inline-block;font-size:.6rem;margin-left:.2rem;opacity:.4;transition:opacity .15s}
  .sort-header:hover .sort-arrow{opacity:.8}
  .sort-active .sort-arrow{opacity:1;color:var(--gold)}
  .sort-header{cursor:pointer;user-select:none;transition:color .15s}
  .sort-header:hover{color:var(--gold)!important}
  .sort-arrow{display:inline-block;font-size:.65rem;margin-left:.2rem;opacity:.35;transition:opacity .15s}
  .sort-header:hover .sort-arrow{opacity:.7}
  .sort-active .sort-arrow{opacity:1}
  .log-table td{padding:.7rem 1rem;border-bottom:1px solid rgba(200,130,10,.06);font-size:.82rem;vertical-align:top}
  .log-table tr:hover td{background:rgba(200,130,10,.03)}
  .log-table tr.hidden-row{display:none}
  .cat-badge{display:inline-block;padding:.15rem .5rem;border-radius:1px;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;font-family:'Cinzel',serif;white-space:nowrap}
  .cat-membros {background:rgba(60,100,200,.15);border:1px solid rgba(60,100,200,.3);color:#8ab4f8}
  .cat-sugestoes{background:rgba(200,130,10,.12);border:1px solid rgba(200,130,10,.3);color:var(--amber)}
  .cat-enquetes {background:rgba(130,60,200,.12);border:1px solid rgba(130,60,200,.3);color:#c084fc}
  .cat-setlist  {background:rgba(30,150,80,.12);border:1px solid rgba(30,150,80,.3);color:#6ee7b7}
  .cat-repertorio{background:rgba(200,80,30,.12);border:1px solid rgba(200,80,30,.3);color:#fca5a5}
  .cat-forum    {background:rgba(200,160,20,.12);border:1px solid rgba(200,160,20,.3);color:#fde68a}
  .cat-galeria  {background:rgba(20,160,180,.12);border:1px solid rgba(20,160,180,.3);color:#67e8f9}
  .cat-acesso   {background:rgba(80,200,80,.12);border:1px solid rgba(80,200,80,.3);color:#86efac}
  .log-action{color:var(--cream);font-weight:600}
  .log-detail{color:var(--paper);font-size:.78rem;margin-top:.15rem}
  .log-who{color:var(--amber);font-size:.78rem}
  .log-ts{color:var(--smoke);font-size:.72rem;font-style:italic;white-space:nowrap}
  .empty-state{text-align:center;padding:3rem;color:var(--smoke);font-style:italic}

  /* CLEAR BTN */
  .danger-zone{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid rgba(200,130,10,.1);display:flex;align-items:center;justify-content:space-between;flex-wrap:gap}
  .btn-danger{background:rgba(139,58,10,.2);border:1px solid rgba(139,58,10,.4);color:#fca5a5;padding:.5rem 1.2rem;font-family:'Cinzel',serif;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:1px;transition:all .2s}
  .btn-danger:hover{background:rgba(139,58,10,.4)}

  /* TOAST */
  .toast{position:fixed;bottom:2rem;right:2rem;background:linear-gradient(135deg,var(--brown),rgba(19,15,9,.95));border:1px solid var(--amber);color:var(--cream);padding:1rem 1.5rem;border-radius:2px;font-size:.85rem;z-index:10000;transform:translateY(100px);opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1)}
  .toast.show{transform:translateY(0);opacity:1}

  @media(max-width:600px){
    main{padding:2rem 1rem}
    .page-title{font-size:1.4rem}
    .log-table th:nth-child(3),.log-table td:nth-child(3){display:none}
    .filters{gap:.4rem}
    .stats-grid{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Retórica</a>
  <a class="nav-back" href="index.html">← Voltar ao site</a>
</nav>

<main>
  <!-- LOGIN WALL -->
  <div id="loginWall">
    <div class="lock-icon">🔒</div>
    <div class="login-title">Área restrita a membros</div>
    <div class="login-sub">Faça login com sua conta Google aprovada para ver os logs</div>
    <button class="btn-google" onclick="doLogin()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.569 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z"/></svg>
      Entrar com Google
    </button>
    <div class="denied-msg" id="deniedMsg" style="display:none"></div>
  </div>

  <!-- LOG CONTENT (shown after login) -->
  <div id="logContent">
    <div class="page-header">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem">
        <div>
          <h1 class="page-title">Logs de Alterações</h1>
          <p class="page-sub" id="loggedAs"></p>
        </div>
        <button class="btn-ghost" onclick="doLogout()">Sair</button>
      </div>
    </div>

    <!-- STORAGE METRIC -->
    <div id="storageMetric"></div>

    <!-- REALTIME METRICS -->
    <div id="realtimeMetrics"></div>

    <!-- STATS -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- FILTERS -->
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">Todas</button>
      <button class="filter-btn" onclick="setFilter('membros',this)">Membros</button>
      <button class="filter-btn" onclick="setFilter('sugestoes',this)">Sugestões</button>
      <button class="filter-btn" onclick="setFilter('enquetes',this)">Enquetes</button>
      <button class="filter-btn" onclick="setFilter('setlist',this)">Setlist</button>
      <button class="filter-btn" onclick="setFilter('repertorio',this)">Repertório</button>
      <button class="filter-btn" onclick="setFilter('forum',this)">Fórum</button>
      <button class="filter-btn" onclick="setFilter('galeria',this)">Galeria</button>
      <button class="filter-btn" onclick="setFilter('acesso',this)">🔑 Acesso</button>
      <input class="filter-search" type="text" placeholder="Buscar nos logs…" oninput="applySearch(this.value)" id="searchInput">
      <span class="filter-count" id="filterCount"></span>
    </div>

    <!-- TABLE -->
    <div style="overflow-x:auto">
      <table class="log-table">
        <thead>
          <tr>
            <th class="sort-header" onclick="sortBy('action')" data-sort="action">Ação <span class="sort-arrow"></span></th>
            <th class="sort-header" onclick="sortBy('detail')" data-sort="detail">Detalhe <span class="sort-arrow"></span></th>
            <th class="sort-header" onclick="sortBy('who')" data-sort="who">Quem <span class="sort-arrow"></span></th>
            <th class="sort-header" onclick="sortBy('ts')" data-sort="ts">Quando <span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none">Nenhum log encontrado.</div>
    </div>

    <!-- DANGER ZONE -->
    <div class="danger-zone" style="gap:1rem;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:.4rem">
        <span style="font-size:.78rem;color:var(--smoke);font-style:italic">Ações de manutenção do sistema:</span>
        <button class="btn-ghost" style="width:fit-content;border-color:var(--rust);color:#fca5a5" onclick="runSuggestionsCleanup()">🧹 Varredura: Limpar 3+ dislikes</button>
      </div>
      <button class="btn-danger" onclick="confirmClearLogs()">🗑 Limpar todos os logs</button>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs,
  onSnapshot, deleteDoc, orderBy, query, writeBatch,
  addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getStorage, ref as storageRef, listAll
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUgxw6RxmiQJnlo1trXL7l8lLYKuk0984",
  authDomain: "retorica-b05b3.firebaseapp.com",
  projectId: "retorica-b05b3",
  storageBucket: "retorica-b05b3.firebasestorage.app",
  messagingSenderId: "299312853191",
  appId: "1:299312853191:web:f3f2536da460743940cee2",
  measurementId: "G-2TQ7Q80QPK"
};

const app      = initializeApp(firebaseConfig);
const db       = getFirestore(app);
const auth     = getAuth(app);
const provider = new GoogleAuthProvider();
const storage  = getStorage(app);

let allLogs      = [];
let activeFilter = 'all';
let activeSearch = '';
let sortField    = 'ts';       // 'action','category','who','ts'
let sortDir      = -1;          // -1 = desc, 1 = asc
let realtimeData = {};
let storageStats   = { files: 0, bytes: 0 };
const TS_FIELDS  = ['ts','createdAt'];

// Firebase Storage Spark free tier: 5 GB
const STORAGE_LIMIT = 5 * 1024 * 1024 * 1024; // 5 GB in bytes

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1024 * 1024 * 1024) return (b / (1024 * 1024)).toFixed(2) + ' MB';
  return (b / (1024 * 1024 * 1024)).toFixed(3) + ' GB';
}

function calcStorageStats() {
  const galleryData = realtimeData.gallery || [];
  let totalBytes = 0;
  galleryData.forEach(p => {
    if (p.compSize) totalBytes += p.compSize * 1024;
    else if (p.origSize) totalBytes += p.origSize * 1024;
    else totalBytes += 500 * 1024; // fallback estimate
  });
  storageStats.files = galleryData.length;
  storageStats.bytes = totalBytes;
  renderStorageMetric();
}

// ─── AUTH ──────────────────────────────────────────────────────────
async function isApproved(email) {
  const snap = await getDoc(doc(db,'approved_emails', email.toLowerCase()));
  return snap.exists();
}

onAuthStateChanged(auth, async user => {
  if (user) {
    const ok = await isApproved(user.email);
    if (!ok) {
      await signOut(auth);
      document.getElementById('deniedMsg').textContent = `${user.email} não está na lista de membros aprovados.`;
      document.getElementById('deniedMsg').style.display = 'block';
      return;
    }
    document.getElementById('loginWall').style.display    = 'none';
    document.getElementById('logContent').style.display   = 'block';
    document.getElementById('loggedAs').textContent       = `Logado como ${user.displayName || user.email}`;
    startListening();
  } else {
    document.getElementById('loginWall').style.display  = 'flex';
    document.getElementById('logContent').style.display = 'none';
  }
});

window.doLogin = async () => {
  try {
    const result = await signInWithPopup(auth, provider);
    const ok = await isApproved(result.user.email);
    if (!ok) {
      await signOut(auth);
      document.getElementById('deniedMsg').textContent = `${result.user.email} não está na lista de membros aprovados.`;
      document.getElementById('deniedMsg').style.display = 'block';
    }
  } catch(e) {
    if (e.code === 'auth/popup-closed-by-user') return;
    showToast('Erro ao entrar: ' + (e.message || 'Tente novamente.'));
  }
};

window.doLogout = async () => { await signOut(auth); };

// ─── REALTIME COLLECTIONS ─────────────────────────────────────────
const RT_COLLECTIONS = ['members','gallery','forum','suggestions','polls','approved_emails'];

function startRTListeners() {
  RT_COLLECTIONS.forEach(colName => {
    onSnapshot(collection(db, colName), snap => {
      realtimeData[colName] = snap.docs.map(d => ({id: d.id, ...d.data()}));
      renderRealtimeMetrics();
    });
  });
}

function renderRealtimeMetrics() {
  // Recalculate storage stats when gallery data arrives
  const galForStorage = realtimeData.gallery || [];
  if (galForStorage.length) {
    let totalBytes = 0;
    galForStorage.forEach(p => {
      if (p.compSize) totalBytes += p.compSize * 1024;
      else if (p.origSize) totalBytes += p.origSize * 1024;
      else totalBytes += 500 * 1024;
    });
    storageStats.files = galForStorage.length;
    storageStats.bytes = totalBytes;
    renderStorageMetric();
  }

  const el = document.getElementById('realtimeMetrics');
  if (!el || !Object.keys(realtimeData).length) return;

  const members    = realtimeData.members || [];
  const gallery    = realtimeData.gallery || [];
  const forums     = realtimeData.forum || [];
  const suggestions= realtimeData.suggestions || [];
  const polls      = realtimeData.polls || [];
  const approvals  = realtimeData.approved_emails || [];

  // Gallery stats: total views, reactions, comments
  let totalGallLikes = 0, totalGallComments = 0, totalGallReplies = 0;
  gallery.forEach(p => {
    const r = p.reactions || {};
    totalGallLikes += Object.keys(r).filter(k => r[k]==='like').length;
    const cmts = p.comments || [];
    totalGallComments += cmts.length;
    cmts.forEach(c => { totalGallReplies += (c.replies||[]).length; });
  });

  // Forum stats
  let totalForumPosts = 0, totalForumReplies = 0, totalForumLikes = 0;
  forums.forEach(t => {
    const posts = t.posts || [];
    totalForumPosts += posts.length;
    posts.forEach(p => {
      const r = p.reactions || {};
      totalForumLikes += Object.values(r).filter(v=>v==='like').length;
      totalForumReplies += (p.replies||[]).length;
    });
  });

  // Suggestions stats
  let totalSugVotes = 0;
  suggestions.forEach(s => { totalSugVotes += (s.likes||0) + (s.dislikes||0); });
  const topSuggestion = suggestions.length
    ? suggestions.reduce((a,b) => (a.likes||0) > (b.likes||0) ? a : b)
    : null;

  // Polls stats
  let totalPollVotes = 0;
  polls.forEach(p => { totalPollVotes += (p.options||[]).reduce((s,o)=>s+(o.votes||0),0); });

  // Members approved vs actual
  const numMembers = members.length;
  const numApproved = approvals.length;

  el.innerHTML = `
    <div class="detail-section">
      <div class="detail-title">Dados em Tempo Real</div>
      <div class="metric-row">
        <div class="metric-card">
          <div class="metric-label">Membros da Banda</div>
          <div class="metric-value gold">${numMembers}</div>
          <div style="font-size:.7rem;color:var(--smoke);margin-top:.2rem">${numApproved} e-mail${numApproved!==1?'s':''} aprovado${numApproved!==1?'s':''}</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Fotos na Galeria</div>
          <div class="metric-value gold">${gallery.length}</div>
          <div style="font-size:.7rem;color:var(--smoke);margin-top:.2rem">👍 ${totalGallLikes} · 💬 ${totalGallComments} comentários · ↩ ${totalGallReplies} respostas</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Tópicos no Fórum</div>
          <div class="metric-value gold">${forums.length}</div>
          <div style="font-size:.7rem;color:var(--smoke);margin-top:.2rem">💬 ${totalForumPosts} posts · 👍 ${totalForumLikes} · ↩ ${totalForumReplies} respostas</div>
        </div>
      </div>
      <div class="metric-row">
        <div class="metric-card">
          <div class="metric-label">Sugestões de Músicas</div>
          <div class="metric-value gold">${suggestions.length}</div>
          <div style="font-size:.7rem;color:var(--smoke);margin-top:.2rem">🗳 ${totalSugVotes} votos${topSuggestion && topSuggestion.likes ? ` · 🏆 "${topSuggestion.song||'?'}"` : ''}</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Enquetes Ativas</div>
          <div class="metric-value gold">${polls.length}</div>
          <div style="font-size:.7rem;color:var(--smoke);margin-top:.2rem">🗳 ${totalPollVotes} votos totais · ${polls.filter(p=>p.closed).length} encerrada${polls.filter(p=>p.closed).length!==1?'s':''}</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Setlist / Repertório</div>
          <div class="metric-value gold">${members.length ? 'Ativo' : '—'}</div>
          <div style="font-size:.7rem;color:var(--smoke);margin-top:.2rem">Veja o setlist no site</div>
        </div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-title">Top Conteúdo</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
        <div class="metric-card">
          <div class="metric-label">📸 Fotos Mais Curtidas</div>
          <table class="top-table">
            ${[...gallery].sort((a,b)=>Object.values(b.reactions||{}).filter(v=>v==='like').length - Object.values(a.reactions||{}).filter(v=>v==='like').length).slice(0,3).map((p,i)=>{
              const likes = Object.values(p.reactions||{}).filter(v=>v==='like').length;
              return `<tr><td>${i+1}</td><td>${p.caption||'sem título'}</td><td>👍 ${likes}</td></tr>`;
            }).join('') || '<tr><td colspan="3" style="color:var(--smoke);text-align:center;font-style:italic">Nenhuma foto</td></tr>'}
          </table>
        </div>
        <div class="metric-card">
          <div class="metric-label">💬 Fotos Mais Comentadas</div>
          <table class="top-table">
            ${[...gallery].sort((a,b)=>(b.comments||[]).length - (a.comments||[]).length).slice(0,3).map((p,i)=>{
              return `<tr><td>${i+1}</td><td>${p.caption||'sem título'}</td><td>💬 ${(p.comments||[]).length}</td></tr>`;
            }).join('') || '<tr><td colspan="3" style="color:var(--smoke);text-align:center;font-style:italic">Nenhuma foto</td></tr>'}
          </table>
        </div>
      </div>
    </div>`;
}

// ─── LOGS ──────────────────────────────────────────────────────────
const CAT_LABELS = {
  membros:'Membros', sugestoes:'Sugestões', enquetes:'Enquetes',
  setlist:'Setlist', repertorio:'Repertório', forum:'Fórum', galeria:'Galeria',
  acesso:'Acesso'
};

function startListening() {
  startRTListeners();
  // Listen to logs collection in Firestore
  onSnapshot(collection(db, 'logs'), snap => {
    allLogs = snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse();
    renderStats();
    renderTable();
  });
}

function renderStorageMetric() {
  const el = document.getElementById('storageMetric');
  if (!el) return;
  const { bytes, files } = storageStats;
  const pct = Math.min((bytes / STORAGE_LIMIT) * 100, 100).toFixed(2);
  const remaining = STORAGE_LIMIT - bytes;
  const isWarn = pct > 70;
  const isCritical = pct > 85;
  const barColor = isCritical ? '#f87171' : isWarn ? '#fbbf24' : 'var(--amber)';

  const limitLabel = '5 GB (plano gratuito)';

  el.innerHTML = `
    <div class="detail-section">
      <div class="detail-title">☁️ Firebase Storage</div>
      <div class="metric-row">
        <div class="metric-card">
          <div class="metric-label">Espaço utilizado</div>
          <div class="metric-value ${isCritical ? '' : isWarn ? '' : 'gold'}" style="${isCritical?'color:#f87171':isWarn?'color:#fbbf24':''}">${formatBytes(bytes)}</div>
          <div class="metric-bar"><div class="metric-bar-fill" style="width:${pct}%;background:linear-gradient(90deg,${barColor},${barColor}dd)"></div></div>
          <div style="font-size:.68rem;color:var(--smoke);margin-top:.4rem">${pct}% de ${limitLabel} · Restam ${formatBytes(remaining)}</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Arquivos na galeria</div>
          <div class="metric-value gold">${files}</div>
          <div style="font-size:.68rem;color:var(--smoke);margin-top:.4rem">Média: ${files ? formatBytes(bytes / files) : '—'} por foto</div>
        </div>
        ${isWarn ? `<div class="metric-card" style="border-color:rgba(250,180,10,.3)">
          <div class="metric-label">${isCritical ? '⚠️ Limite crítico!' : '⚠️ Atenção'}</div>
          <div style="font-size:.82rem;color:${isCritical?'#f87171':'#fbbf24'};margin-top:.3rem">
            ${isCritical
              ? `Muito perto do limite! Remova fotos antigas ou limpe a galeria.`
              : `Acima de 70%, fique atento ao consumo de storage.`}
          </div>
        </div>` : `<div class="metric-card">
          <div class="metric-label">Status</div>
          <div style="font-size:1rem;color:#6ee7b7;margin-top:.3rem">✓ Dentro do limite</div>
        </div>`}
      </div>
    </div>`;
}

function renderStats() {
  const counts = {};
  allLogs.forEach(l => { counts[l.category] = (counts[l.category]||0) + 1; });
  const grid = document.getElementById('statsGrid');

  // Recent logins list
  const logins = allLogs.filter(l => l.category === 'acesso').slice(0, 8);
  const loginRows = logins.length
    ? logins.map(l => `
        <div style="display:flex;justify-content:space-between;align-items:baseline;padding:.45rem 0;border-bottom:1px solid rgba(200,130,10,.07);gap:.8rem">
          <span style="font-size:.82rem;color:var(--cream)">${l.who||'?'}</span>
          <span style="font-size:.72rem;color:var(--smoke);font-style:italic;white-space:nowrap">${l.tsLocal||'—'}</span>
        </div>`).join('')
    : `<div style="font-size:.8rem;color:var(--smoke);font-style:italic;padding:.5rem 0">Nenhum login registrado ainda.</div>`;

  // Activity heat by day
  const dayCounts = {};
  allLogs.forEach(l => {
    if (l.tsLocal) {
      // extract date like "dd/mm/yyyy" or "dd/mm/yyyy, hh:mm:ss"
      const datePart = l.tsLocal.split(', ')[0];
      dayCounts[datePart] = (dayCounts[datePart]||0) + 1;
    }
  });
  const dayEntries = Object.entries(dayCounts).slice(-7); // last 7 active days
  const maxDay = Math.max(...Object.values(dayCounts), 1);

  const gridHtml = `
    <div class="stat-card"><div class="stat-num">${allLogs.length}</div><div class="stat-label">Total de ações</div></div>
    ${Object.entries(CAT_LABELS).map(([k,v]) => `
      <div class="stat-card" style="cursor:pointer" onclick="setFilterById('${k}')">
        <div class="stat-num">${counts[k]||0}</div>
        <div class="stat-label">${v}</div>
      </div>`).join('')}
    ${dayEntries.length ? `<div class="stat-card" style="grid-column:1/-1;padding:.8rem 1rem">
      <div class="stat-label" style="margin-bottom:.5rem">Atividade por dia</div>
      <div style="display:flex;gap:.3rem;align-items:flex-end;height:32px">
        ${dayEntries.map(([d,c]) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:.2rem"><span style="font-size:.55rem;color:var(--smoke)">${c}</span><div style="width:100%;background:linear-gradient(180deg,var(--gold),var(--amber));border-radius:1px;height:${Math.max(c/maxDay*100,8)}%"></div><span style="font-size:.48rem;color:var(--smoke)">${d.split('/').slice(0,2).join('/')}</span></div>`).join('')}
      </div>
    </div>` : ''}
    <div style="grid-column:1/-1;background:linear-gradient(135deg,rgba(42,26,8,.7),rgba(19,15,9,.8));border:1px solid rgba(80,200,80,.2);border-radius:1px;padding:1.2rem 1.4rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem">
        <span style="font-family:'Cinzel',serif;font-size:.85rem;color:#86efac;letter-spacing:.08em">🔑 Últimos Logins</span>
        <button class="filter-btn" onclick="setFilterById('acesso')" style="font-size:.65rem;padding:.2rem .6rem">${counts['acesso']||0} total</button>
      </div>
      ${loginRows}
    </div>`;

  grid.innerHTML = gridHtml;
}

window.setFilterById = id => {
  activeFilter = id;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  const btns = document.querySelectorAll('.filter-btn');
  btns.forEach(b => { if(b.getAttribute('onclick')?.includes(`'${id}'`)) b.classList.add('active'); });
  renderTable();
};

function getSortScore(log) {
  if (sortField === 'action') return log.action || '';
  if (sortField === 'detail') return log.detail || '';
  if (sortField === 'who') return log.who || '';
  return log.createdAt?.toMillis?.() || log.ts || 0;
}

window.sortBy = field => {
  if (sortField === field) { sortDir *= -1; }
  else { sortField = field; sortDir = field === 'ts' ? -1 : 1; }
  renderTable();
  updateSortArrows();
};

function updateSortArrows() {
  const arrows = { 1: '&#9650;', '-1': '&#9660;' };
  document.querySelectorAll('.sort-header').forEach(th => {
    const f = th.dataset.sort;
    const active = f === sortField;
    th.classList.toggle('sort-active', active);
    th.querySelector('.sort-arrow').innerHTML = active ? arrows[sortDir] : '';
  });
}

function renderTable() {
  const body  = document.getElementById('logBody');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('filterCount');

  const filtered = allLogs.filter(l => {
    const matchCat    = activeFilter === 'all' || l.category === activeFilter;
    const matchSearch = !activeSearch ||
      l.action?.toLowerCase().includes(activeSearch) ||
      l.detail?.toLowerCase().includes(activeSearch) ||
      l.who?.toLowerCase().includes(activeSearch);
    return matchCat && matchSearch;
  });

  // Sort
  filtered.sort((a, b) => {
    const va = getSortScore(a), vb = getSortScore(b);
    if (typeof va === 'number') return (va - vb) * sortDir;
    return String(va).localeCompare(String(vb), 'pt-BR') * sortDir;
  });

  count.textContent = `${filtered.length} registro${filtered.length!==1?'s':''}`;

  if (!filtered.length) {
    body.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  body.innerHTML = filtered.map(l => {
    const cat   = l.category || 'geral';
    const badge = `<span class="cat-badge cat-${cat}">${CAT_LABELS[cat]||cat}</span>`;
    return `<tr>
      <td>${badge}<div class="log-action" style="margin-top:.3rem">${l.action||'—'}</div></td>
      <td><div class="log-detail">${l.detail||'—'}</div></td>
      <td><span class="log-who">${l.who||'?'}</span>${l.whoEmail ? `<div style="font-size:.68rem;color:var(--smoke)">${l.whoEmail}</div>` : ''}</td>
      <td><span class="log-ts">${l.tsLocal||'—'}</span></td>
    </tr>`;
  }).join('');
}

window.setFilter = (cat, btn) => {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
};

window.applySearch = val => {
  activeSearch = val.toLowerCase().trim();
  renderTable();
};

window.confirmClearLogs = () => {
  if (!confirm('Tem certeza? Isso vai apagar TODOS os logs permanentemente. Esta ação não pode ser desfeita.')) return;
  clearAllLogs();
};

async function clearAllLogs() {
  showToast('⏳ Limpando logs…');
  const snap = await getDocs(collection(db,'logs'));
  // Batch delete in groups of 500
  const batchSize = 499;
  let batch = writeBatch(db);
  let i = 0;
  for (const d of snap.docs) {
    batch.delete(d.ref);
    i++;
    if (i % batchSize === 0) { await batch.commit(); batch = writeBatch(db); }
  }
  await batch.commit();
  showToast(`✓ ${snap.size} log${snap.size!==1?'s':''} removido${snap.size!==1?'s':''}.`);
}

window.runSuggestionsCleanup = async () => {
  if (!confirm('Deseja iniciar a varredura? Todas as músicas com 3 ou mais dislikes serão removidas e as mensagens de motivação serão enviadas ao WhatsApp.')) return;
  
  showToast('⏳ Iniciando varredura…');
  let removedCount = 0;
  
  try {
    const snap = await getDocs(collection(db, 'suggestions'));
    const toRemove = snap.docs.filter(d => {
      const s = d.data();
      return (s.dislikes || 0) >= 3;
    });
    
    if (toRemove.length === 0) {
      showToast('✨ Nenhuma música com 3+ dislikes encontrada.');
      return;
    }
    
    for (const d of toRemove) {
      const s = d.data();
      const id = d.id;
      
      // Deleta a sugestão
      await deleteDoc(doc(db, 'suggestions', id));
      
      // Cria o log que dispara o WhatsApp
      await addDoc(collection(db, 'logs'), {
        action: 'Sugestão Removida',
        song: s.song,
        artist: s.artist,
        by: s.by || 'Membro',
        likes: s.likes || 0,
        dislikes: s.dislikes || 0,
        reason: 'Atingiu o limite de 3 dislikes (Varredura de manutenção)',
        removedBy: 'Varredura Automática',
        category: 'sugestoes',
        ts: serverTimestamp()
      });
      
      removedCount++;
    }
    
    showToast(`✅ Varredura concluída! ${removedCount} música(s) removida(s).`);
  } catch (e) {
    console.error('Cleanup error:', e);
    showToast('❌ Erro durante a varredura. Veja o console.');
  }
};

// ─── UTILS ─────────────────────────────────────────────────────────
window.showToast = msg => {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
};
</script>
