<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retórica — Logs</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;700;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{--black:#0a0804;--dark:#130f09;--brown:#2a1a08;--amber:#c8820a;--gold:#e8a820;--cream:#f0e4c8;--rust:#8b3a0a;--paper:#d4c4a0;--smoke:#6b6050}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--black);color:var(--cream);font-family:'Lora',serif;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.4}

  /* NAV */
  nav{background:linear-gradient(180deg,rgba(10,8,4,.98),rgba(10,8,4,.85));border-bottom:1px solid rgba(200,130,10,.3);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:60px;backdrop-filter:blur(10px);position:sticky;top:0;z-index:100}
  .nav-logo{font-family:'Cinzel',serif;font-size:1.2rem;font-weight:900;color:var(--gold);letter-spacing:.15em;text-decoration:none}
  .nav-back{font-family:'Cinzel',serif;font-size:.75rem;color:var(--amber);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border:1px solid rgba(200,130,10,.3);padding:.4rem .9rem;border-radius:1px;transition:all .2s}
  .nav-back:hover{background:rgba(200,130,10,.1);border-color:var(--amber)}

  /* LAYOUT */
  main{max-width:1000px;margin:0 auto;padding:3rem 1.5rem}

  /* HEADER */
  .page-header{margin-bottom:2.5rem}
  .page-title{font-family:'Cinzel',serif;font-size:2rem;font-weight:700;color:var(--cream);margin-bottom:.4rem}
  .page-sub{font-size:.82rem;color:var(--smoke);font-style:italic}

  /* LOGIN WALL */
  #loginWall{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:1.5rem;text-align:center}
  .lock-icon{font-size:3rem;opacity:.4}
  .login-title{font-family:'Cinzel',serif;font-size:1.3rem;color:var(--cream)}
  .login-sub{font-size:.85rem;color:var(--smoke);font-style:italic}
  .btn-google{display:flex;align-items:center;justify-content:center;gap:.8rem;padding:.8rem 1.8rem;background:#fff;color:#3c3c3c;border:1px solid #ddd;border-radius:2px;font-family:'Cinzel',serif;font-size:.82rem;font-weight:700;letter-spacing:.1em;cursor:pointer;transition:background .2s,box-shadow .2s}
  .btn-google:hover{background:#f5f5f5;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .btn-ghost{background:transparent;border:1px solid rgba(200,130,10,.4);color:var(--amber);padding:.5rem 1.2rem;font-family:'Cinzel',serif;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:1px;transition:all .2s}
  .btn-ghost:hover{background:rgba(200,130,10,.1)}
  .denied-msg{color:#e06060;font-size:.85rem}

  /* FILTERS */
  #logContent{display:none}
  .filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;align-items:center}
  .filter-btn{background:rgba(10,8,4,.8);border:1px solid rgba(200,130,10,.2);color:var(--smoke);padding:.35rem .9rem;font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:1px;transition:all .2s}
  .filter-btn:hover{border-color:rgba(200,130,10,.5);color:var(--paper)}
  .filter-btn.active{background:rgba(200,130,10,.15);border-color:var(--amber);color:var(--amber)}
  .filter-search{background:rgba(10,8,4,.8);border:1px solid rgba(200,130,10,.2);color:var(--cream);padding:.35rem .8rem;font-family:'Lora',serif;font-size:.82rem;border-radius:1px;outline:none;transition:border-color .2s;flex:1;min-width:160px;max-width:280px}
  .filter-search:focus{border-color:var(--amber)}
  .filter-count{font-size:.75rem;color:var(--smoke);font-style:italic;margin-left:auto}

  /* STATS */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.8rem;margin-bottom:2rem}
  .stat-card{background:linear-gradient(135deg,rgba(42,26,8,.7),rgba(19,15,9,.8));border:1px solid rgba(200,130,10,.15);border-radius:1px;padding:.9rem 1rem;text-align:center}
  .stat-num{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--gold);line-height:1}
  .stat-label{font-size:.65rem;color:var(--smoke);letter-spacing:.1em;text-transform:uppercase;margin-top:.2rem}

  /* LOG TABLE */
  .log-table{width:100%;border-collapse:collapse}
  .log-table th{font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);padding:.6rem 1rem;border-bottom:1px solid rgba(200,130,10,.25);text-align:left;background:rgba(42,26,8,.4)}
  .log-table td{padding:.7rem 1rem;border-bottom:1px solid rgba(200,130,10,.06);font-size:.82rem;vertical-align:top}
  .log-table tr:hover td{background:rgba(200,130,10,.03)}
  .log-table tr.hidden-row{display:none}
  .cat-badge{display:inline-block;padding:.15rem .5rem;border-radius:1px;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;font-family:'Cinzel',serif;white-space:nowrap}
  .cat-membros {background:rgba(60,100,200,.15);border:1px solid rgba(60,100,200,.3);color:#8ab4f8}
  .cat-sugestoes{background:rgba(200,130,10,.12);border:1px solid rgba(200,130,10,.3);color:var(--amber)}
  .cat-enquetes {background:rgba(130,60,200,.12);border:1px solid rgba(130,60,200,.3);color:#c084fc}
  .cat-setlist  {background:rgba(30,150,80,.12);border:1px solid rgba(30,150,80,.3);color:#6ee7b7}
  .cat-repertorio{background:rgba(200,80,30,.12);border:1px solid rgba(200,80,30,.3);color:#fca5a5}
  .cat-forum    {background:rgba(200,160,20,.12);border:1px solid rgba(200,160,20,.3);color:#fde68a}
  .cat-galeria  {background:rgba(20,160,180,.12);border:1px solid rgba(20,160,180,.3);color:#67e8f9}
  .log-action{color:var(--cream);font-weight:600}
  .log-detail{color:var(--paper);font-size:.78rem;margin-top:.15rem}
  .log-who{color:var(--amber);font-size:.78rem}
  .log-ts{color:var(--smoke);font-size:.72rem;font-style:italic;white-space:nowrap}
  .empty-state{text-align:center;padding:3rem;color:var(--smoke);font-style:italic}

  /* CLEAR BTN */
  .danger-zone{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid rgba(200,130,10,.1);display:flex;align-items:center;justify-content:space-between;flex-wrap:gap}
  .btn-danger{background:rgba(139,58,10,.2);border:1px solid rgba(139,58,10,.4);color:#fca5a5;padding:.5rem 1.2rem;font-family:'Cinzel',serif;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:1px;transition:all .2s}
  .btn-danger:hover{background:rgba(139,58,10,.4)}

  /* TOAST */
  .toast{position:fixed;bottom:2rem;right:2rem;background:linear-gradient(135deg,var(--brown),rgba(19,15,9,.95));border:1px solid var(--amber);color:var(--cream);padding:1rem 1.5rem;border-radius:2px;font-size:.85rem;z-index:10000;transform:translateY(100px);opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1)}
  .toast.show{transform:translateY(0);opacity:1}

  @media(max-width:600px){
    main{padding:2rem 1rem}
    .page-title{font-size:1.4rem}
    .log-table th:nth-child(3),.log-table td:nth-child(3){display:none}
    .filters{gap:.4rem}
    .stats-grid{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Retórica</a>
  <a class="nav-back" href="index.html">← Voltar ao site</a>
</nav>

<main>
  <!-- LOGIN WALL -->
  <div id="loginWall">
    <div class="lock-icon">🔒</div>
    <div class="login-title">Área restrita a membros</div>
    <div class="login-sub">Faça login com sua conta Google aprovada para ver os logs</div>
    <button class="btn-google" onclick="doLogin()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.569 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z"/></svg>
      Entrar com Google
    </button>
    <div class="denied-msg" id="deniedMsg" style="display:none"></div>
  </div>

  <!-- LOG CONTENT (shown after login) -->
  <div id="logContent">
    <div class="page-header">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem">
        <div>
          <h1 class="page-title">Logs de Alterações</h1>
          <p class="page-sub" id="loggedAs"></p>
        </div>
        <button class="btn-ghost" onclick="doLogout()">Sair</button>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- FILTERS -->
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">Todas</button>
      <button class="filter-btn" onclick="setFilter('membros',this)">Membros</button>
      <button class="filter-btn" onclick="setFilter('sugestoes',this)">Sugestões</button>
      <button class="filter-btn" onclick="setFilter('enquetes',this)">Enquetes</button>
      <button class="filter-btn" onclick="setFilter('setlist',this)">Setlist</button>
      <button class="filter-btn" onclick="setFilter('repertorio',this)">Repertório</button>
      <button class="filter-btn" onclick="setFilter('forum',this)">Fórum</button>
      <button class="filter-btn" onclick="setFilter('galeria',this)">Galeria</button>
      <input class="filter-search" type="text" placeholder="Buscar nos logs…" oninput="applySearch(this.value)" id="searchInput">
      <span class="filter-count" id="filterCount"></span>
    </div>

    <!-- TABLE -->
    <div style="overflow-x:auto">
      <table class="log-table">
        <thead>
          <tr>
            <th>Ação</th>
            <th>Detalhe</th>
            <th>Quem</th>
            <th>Quando</th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none">Nenhum log encontrado.</div>
    </div>

    <!-- DANGER ZONE -->
    <div class="danger-zone">
      <span style="font-size:.78rem;color:var(--smoke);font-style:italic">Os logs são registrados automaticamente a cada ação no site.</span>
      <button class="btn-danger" onclick="confirmClearLogs()">🗑 Limpar todos os logs</button>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc,
  onSnapshot, deleteDoc, orderBy, query, limit, writeBatch, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUgxw6RxmiQJnlo1trXL7l8lLYKuk0984",
  authDomain: "retorica-b05b3.firebaseapp.com",
  projectId: "retorica-b05b3",
  storageBucket: "retorica-b05b3.firebasestorage.app",
  messagingSenderId: "299312853191",
  appId: "1:299312853191:web:f3f2536da460743940cee2",
  measurementId: "G-2TQ7Q80QPK"
};

const app      = initializeApp(firebaseConfig);
const db       = getFirestore(app);
const auth     = getAuth(app);
const provider = new GoogleAuthProvider();

let allLogs      = [];
let activeFilter = 'all';
let activeSearch = '';

// ─── AUTH ──────────────────────────────────────────────────────────
async function isApproved(email) {
  const snap = await getDoc(doc(db,'approved_emails', email.toLowerCase()));
  return snap.exists();
}

onAuthStateChanged(auth, async user => {
  if (user) {
    const ok = await isApproved(user.email);
    if (!ok) {
      await signOut(auth);
      document.getElementById('deniedMsg').textContent = `${user.email} não está na lista de membros aprovados.`;
      document.getElementById('deniedMsg').style.display = 'block';
      return;
    }
    document.getElementById('loginWall').style.display    = 'none';
    document.getElementById('logContent').style.display   = 'block';
    document.getElementById('loggedAs').textContent       = `Logado como ${user.displayName || user.email}`;
    startListening();
  } else {
    document.getElementById('loginWall').style.display  = 'flex';
    document.getElementById('logContent').style.display = 'none';
  }
});

window.doLogin = async () => {
  try { await signInWithPopup(auth, provider); }
  catch(e) { if(e.code!=='auth/popup-closed-by-user') showToast('Erro ao entrar. Tente novamente.'); }
};

window.doLogout = async () => { await signOut(auth); };

// ─── LOGS ──────────────────────────────────────────────────────────
const CAT_LABELS = {
  membros:'Membros', sugestoes:'Sugestões', enquetes:'Enquetes',
  setlist:'Setlist', repertorio:'Repertório', forum:'Fórum', galeria:'Galeria'
};

function startListening() {
  onSnapshot(query(collection(db,'logs'), orderBy('ts','desc'), limit(500)), snap => {
    allLogs = snap.docs.map(d => ({id: d.id, ...d.data()}));
    renderStats();
    renderTable();
  });
}

function renderStats() {
  const counts = {};
  allLogs.forEach(l => { counts[l.category] = (counts[l.category]||0) + 1; });
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-num">${allLogs.length}</div><div class="stat-label">Total</div></div>
    ${Object.entries(CAT_LABELS).map(([k,v]) => `
      <div class="stat-card"><div class="stat-num">${counts[k]||0}</div><div class="stat-label">${v}</div></div>
    `).join('')}
  `;
}

function renderTable() {
  const body  = document.getElementById('logBody');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('filterCount');

  const filtered = allLogs.filter(l => {
    const matchCat    = activeFilter === 'all' || l.category === activeFilter;
    const matchSearch = !activeSearch || 
      l.action?.toLowerCase().includes(activeSearch) ||
      l.detail?.toLowerCase().includes(activeSearch) ||
      l.who?.toLowerCase().includes(activeSearch);
    return matchCat && matchSearch;
  });

  count.textContent = `${filtered.length} registro${filtered.length!==1?'s':''}`;

  if (!filtered.length) {
    body.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  body.innerHTML = filtered.map(l => {
    const cat   = l.category || 'geral';
    const badge = `<span class="cat-badge cat-${cat}">${CAT_LABELS[cat]||cat}</span>`;
    return `<tr>
      <td>${badge}<div class="log-action" style="margin-top:.3rem">${l.action||'—'}</div></td>
      <td><div class="log-detail">${l.detail||'—'}</div></td>
      <td><span class="log-who">${l.who||'?'}</span>${l.whoEmail ? `<div style="font-size:.68rem;color:var(--smoke)">${l.whoEmail}</div>` : ''}</td>
      <td><span class="log-ts">${l.tsLocal||'—'}</span></td>
    </tr>`;
  }).join('');
}

window.setFilter = (cat, btn) => {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
};

window.applySearch = val => {
  activeSearch = val.toLowerCase().trim();
  renderTable();
};

window.confirmClearLogs = () => {
  if (!confirm('Tem certeza? Isso vai apagar TODOS os logs permanentemente. Esta ação não pode ser desfeita.')) return;
  clearAllLogs();
};

async function clearAllLogs() {
  showToast('⏳ Limpando logs…');
  const snap = await getDocs(collection(db,'logs'));
  // Batch delete in groups of 500
  const batchSize = 499;
  let batch = writeBatch(db);
  let i = 0;
  for (const d of snap.docs) {
    batch.delete(d.ref);
    i++;
    if (i % batchSize === 0) { await batch.commit(); batch = writeBatch(db); }
  }
  await batch.commit();
  showToast(`✓ ${snap.size} log${snap.size!==1?'s':''} removido${snap.size!==1?'s':''}.`);
}

// ─── UTILS ─────────────────────────────────────────────────────────
window.showToast = msg => {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
};
</script>
</body>
</html>
